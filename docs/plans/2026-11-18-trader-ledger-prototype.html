<title>Trader Ledger</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
/* Mirrors the live GameYield dashboard (frontend/src/index.css + styles/fixtures.css):
   same tokens, dark 240px sidebar with section labels, metric cards, tables, fixture rows.
   Phone (<1024px): sidebar becomes a bottom nav with a raised "+" and a "More" sheet. */
:root{
  --green:#1D9E75; --green-ink:#127a59; --green-light:#e8f7f2;
  --red:#D85A30; --red-ink:#b8461f; --red-light:#fdf0ec;
  --amber:#BA7517; --amber-ink:#8f5a10; --amber-light:#fef5e7;
  --sidebar-bg:#1a1d27; --sidebar-text:#a0aec0;
  --bg:#f4f6fb; --card-bg:#ffffff; --border:#e2e8f0; --row-line:#f1f5f9; --thead:#f8fafc;
  --text:#1a202c; --text-muted:#5f6b7d;
  --radius:12px; --shadow:0 1px 3px rgba(0,0,0,.08),0 4px 12px rgba(0,0,0,.04);
  --f:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --green:#2fb98b; --green-ink:#4fd1a5; --green-light:#15302a; --red:#f2896a; --red-ink:#f2896a; --red-light:#3a2019;
  --amber:#f0b25a; --amber-ink:#f0b25a; --amber-light:#33280f; --sidebar-bg:#0b0d12;
  --bg:#11141b; --card-bg:#1a1e28; --border:#2b3140; --row-line:#232835; --thead:#1f2430; --text:#e5e9f0; --text-muted:#9aa5b8;
  --shadow:0 4px 18px rgba(0,0,0,.45); color-scheme:dark}}
:root[data-theme="dark"]{
  --green:#2fb98b; --green-ink:#4fd1a5; --green-light:#15302a; --red:#f2896a; --red-ink:#f2896a; --red-light:#3a2019;
  --amber:#f0b25a; --amber-ink:#f0b25a; --amber-light:#33280f; --sidebar-bg:#0b0d12;
  --bg:#11141b; --card-bg:#1a1e28; --border:#2b3140; --row-line:#232835; --thead:#1f2430; --text:#e5e9f0; --text-muted:#9aa5b8;
  --shadow:0 4px 18px rgba(0,0,0,.45); color-scheme:dark}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--text);font:400 14px/1.5 var(--f);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button,a,select,summary,label.track-toggle{cursor:pointer;touch-action:manipulation}
:focus-visible{outline:2px solid var(--green);outline-offset:2px}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
svg.i{width:16px;height:16px;flex:none}
[hidden]{display:none!important}
a{color:var(--green-ink)}

/* ---------- sidebar (desktop) ---------- */
.sidebar{display:none;width:240px;background:var(--sidebar-bg);color:var(--sidebar-text);flex-direction:column;position:fixed;inset:0 auto 0 0;z-index:100}
.sidebar-logo{padding:24px 20px 20px;border-bottom:1px solid rgba(255,255,255,.06)}
.sidebar-logo h1{font-size:15px;font-weight:700;color:#fff;line-height:1.3}
.sidebar-logo span{font-size:11px}
.sidebar-nav{flex:1;padding:16px 12px;overflow:auto}
.sidebar-section-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:rgba(255,255,255,.3);padding:10px 12px 4px}
.nav-item{display:flex;align-items:center;gap:10px;width:100%;padding:10px 12px;border-radius:8px;font-size:13px;font-weight:500;margin-bottom:2px;background:none;border:0;color:var(--sidebar-text);text-align:left}
.nav-item:hover{background:rgba(255,255,255,.06);color:#fff}
.nav-item[aria-current="page"]{background:rgba(29,158,117,.18);color:#2fd19c}
.nav-item .cnt{margin-left:auto;font-size:10px;font-weight:700;background:var(--amber);color:#fff;border-radius:99px;padding:1px 6px}
.side-foot{padding:12px;border-top:1px solid rgba(255,255,255,.06);display:flex;flex-direction:column;gap:8px}
.side-new{background:var(--green);color:#fff;border:0;border-radius:8px;padding:10px;font-weight:600;font-size:13px;display:flex;gap:6px;align-items:center;justify-content:center}
.side-rates{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:8px;padding:8px 10px;font-size:11px;text-align:left;color:var(--sidebar-text)}
.side-rates b{color:#fff;font-weight:600}

/* ---------- top bar ---------- */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--border)}
.top-in{display:flex;align-items:center;gap:10px;padding:8px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px))}
.brand{font-weight:700;font-size:15px}
.demo-chip{font-size:11px;font-weight:600;background:var(--amber-light);color:var(--amber-ink);padding:2px 8px;border-radius:99px;white-space:nowrap}
.sp{flex:1}
.curseg{display:inline-flex;border:1px solid var(--border);border-radius:8px;overflow:hidden;background:var(--card-bg)}
.curseg button{border:0;border-right:1px solid var(--border);background:none;min-width:40px;height:34px;font-weight:600;color:var(--text-muted)}
.curseg button:last-child{border-right:0}
.curseg button[aria-pressed="true"]{background:var(--green);color:#fff}
.linkbtn{background:none;border:0;color:var(--green-ink);font-weight:600;padding:8px 4px;font-size:13px}

/* ---------- page ---------- */
main{padding:20px max(16px,env(safe-area-inset-right,0px)) calc(110px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));max-width:1200px;display:flex;flex-direction:column;gap:24px}
.page-header{display:flex;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;gap:12px}
.page-title{font-size:22px;font-weight:700;line-height:1.25}
.page-subtitle{font-size:13px;color:var(--text-muted);margin-top:2px}
.header-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.muted{color:var(--text-muted)}
.fine{font-size:12.5px;color:var(--text-muted)}
section{display:flex;flex-direction:column;gap:10px;min-width:0}
.sec-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sec-h h2{font-size:14px;font-weight:700}
.sec-h .cnt{font-size:11px;color:var(--text-muted)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 16px;border-radius:8px;font-size:13px;font-weight:600;border:1px solid transparent;min-height:40px;text-decoration:none;white-space:nowrap}
.btn-primary{background:var(--green);color:#fff}
.btn-primary:hover{background:#179266}
.btn-ghost{background:var(--card-bg);color:var(--text-muted);border-color:var(--border)}
.btn-ghost:hover{background:var(--bg);color:var(--text)}
.btn-danger{background:var(--red-light);color:var(--red-ink)}
.btn-violet{background:#7c3aed;color:#fff}
.btn-sm{padding:6px 12px;font-size:12px;min-height:34px}
.btn.on{background:var(--text);color:var(--bg);border-color:var(--text)}
.btn:disabled{opacity:.45;cursor:not-allowed}

.card{background:var(--card-bg);border-radius:var(--radius);box-shadow:var(--shadow);border:1px solid var(--border)}
.metrics-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.metric-card{background:var(--card-bg);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);border:1px solid var(--border);text-align:left;display:flex;flex-direction:column}
button.metric-card:hover{border-color:#cbd5e0}
.metric-card .label{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--text-muted);margin-bottom:6px}
.metric-card .value{font-size:22px;font-weight:700;line-height:1.2;font-variant-numeric:tabular-nums}
.value.green{color:var(--green-ink)} .value.red{color:var(--red-ink)} .value.amber{color:var(--amber-ink)}
.metric-card .sub{font-size:11px;color:var(--text-muted);margin-top:4px}

.table-wrap{overflow-x:auto;border-radius:var(--radius);box-shadow:var(--shadow);border:1px solid var(--border);background:var(--card-bg)}
table{width:100%;border-collapse:collapse}
thead th{background:var(--thead);padding:11px 14px;text-align:left;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--text-muted);border-bottom:1px solid var(--border);white-space:nowrap}
thead th button{all:unset;cursor:pointer}
tbody td{padding:12px 14px;border-bottom:1px solid var(--row-line);font-size:13px;white-space:nowrap}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover td{background:rgba(127,140,160,.05)}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
td.g{font-weight:600;white-space:normal;min-width:180px}
.pos{color:var(--green-ink)} .neg{color:var(--red-ink)}
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:20px;font-size:11px;font-weight:600;white-space:nowrap}
.badge-green{background:var(--green-light);color:var(--green-ink)}
.badge-red{background:var(--red-light);color:var(--red-ink)}
.badge-amber{background:var(--amber-light);color:var(--amber-ink)}
.badge-gray{background:rgba(127,140,160,.14);color:var(--text-muted)}
.badge-blue{background:#dbeafe;color:#1d4ed8}
.badge-violet{background:#ede9fe;color:#6d28d9}
.margin-chip{display:inline-block;padding:2px 7px;border-radius:6px;font-size:11.5px;font-weight:600;font-variant-numeric:tabular-nums}
.warn-box{background:var(--amber-light);border:1px solid #f3d9a6;color:var(--amber-ink);border-radius:var(--radius);padding:12px 16px;display:flex;gap:12px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
.warn-box b{display:block}

/* home */
.capture{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center;background:var(--green);color:#fff;border:0;border-radius:var(--radius);padding:16px 18px;text-align:left;box-shadow:var(--shadow)}
.capture .mic{width:48px;height:48px;border-radius:50%;background:rgba(255,255,255,.2);display:grid;place-items:center}
.capture .mic svg{width:24px;height:24px}
.capture strong{display:block;font-size:16px}
.capture span{font-size:13px;opacity:.92}
.pend{padding:12px 14px;display:flex;flex-direction:column;gap:8px;border-left:4px solid var(--amber)}
.pend .org{font-size:11.5px;color:var(--text-muted)}
.pend q{quotes:none;display:block;font-size:14px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.list{display:flex;flex-direction:column}
.list > *{border-bottom:1px solid var(--row-line)}
.list > *:last-child{border-bottom:0}
.item{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:12px 16px;background:none;border:0;text-align:left;width:100%;align-items:center}
button.item:hover{background:rgba(127,140,160,.06)}
.item .t{font-weight:600;min-width:0;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.item .s{font-size:12px;color:var(--text-muted)}
.item .v{text-align:right;grid-row:span 2}
.amt{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.approx{font-size:11.5px;color:var(--text-muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.bal{font-size:12px;font-weight:600}
.bal.pos{color:var(--green-ink)} .bal.neg{color:var(--amber-ink)} .bal.zero{color:var(--text-muted)}

/* trader */
.search{width:100%;padding:10px 14px;border-radius:8px;border:1px solid var(--border);background:var(--card-bg);min-height:42px}
.back{background:none;border:0;color:var(--green-ink);font-weight:600;padding:4px 0;align-self:flex-start;display:flex;gap:4px;align-items:center;font-size:13px}
.trader-head{padding:18px;display:flex;flex-direction:column;gap:12px}
.trader-head h1{font-size:22px}
.big-bal{font-size:28px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}
.big-bal.pos{color:var(--green-ink)} .big-bal.neg{color:var(--amber-ink)} .big-bal.zero{color:var(--text-muted)}
.curlines{display:flex;flex-wrap:wrap;gap:6px}
.curlines span{background:var(--bg);border-radius:8px;padding:4px 10px;font-size:12.5px}
.deal{padding:12px 16px;display:flex;flex-direction:column;gap:6px}
.deal-top{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:none;border:0;padding:0;text-align:left;width:100%}
.deal-top .g{font-weight:600;flex:1;min-width:12ch}
.deal-math{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:13px}
.deal-more{display:flex;flex-direction:column;gap:8px;padding-top:8px;border-top:1px dashed var(--border)}
blockquote.src{background:var(--bg);border-radius:8px;padding:10px 12px;font-size:13px;border-left:3px solid var(--green)}
blockquote.src span{display:block;font-size:11px;color:var(--text-muted);margin-bottom:2px}

/* dashboard */
.bar{height:6px;border-radius:3px;background:var(--green);opacity:.75;min-width:2px}
.bar.neg{background:var(--red)}
.heat{display:flex;flex-wrap:wrap;gap:6px}
.heat span{padding:6px 10px;border-radius:8px;font-size:12px;display:flex;flex-direction:column;min-width:120px;max-width:220px}
.heat b{font-weight:700;font-variant-numeric:tabular-nums}
.chart-wrap{padding:18px}
.chart-title{font-size:14px;font-weight:600;margin-bottom:12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.det{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;padding:4px 0}
.det div{background:var(--bg);border-radius:8px;padding:10px 12px}
.det .l{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--text-muted)}
.det .v{font-size:15px;font-weight:700;font-variant-numeric:tabular-nums}
.inline-pay{display:flex;gap:6px;align-items:center;flex-wrap:nowrap}
.inline-pay input{width:96px;padding:6px 8px;border-radius:6px;border:1px solid var(--border);background:var(--card-bg);font-size:13px;min-height:34px}
.totals-strip{display:flex;flex-wrap:wrap;overflow:hidden}
.totals-strip > div{flex:1;min-width:150px;padding:16px 20px;border-right:1px solid var(--row-line)}
.totals-strip .l{font-size:11px;color:var(--text-muted);font-weight:600;text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px}
.totals-strip .v{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}
.totals-strip .v.big{font-size:26px}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:8px;overflow:hidden;background:var(--card-bg)}
.seg button{padding:8px 14px;background:transparent;border:0;border-right:1px solid var(--border);color:var(--text-muted);font-size:13px;white-space:nowrap;min-height:38px}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"],.seg button[aria-selected="true"]{background:var(--green);color:#fff;font-weight:600}
.seg.disabled{opacity:.45;pointer-events:none}
.seg.full{display:grid;grid-template-columns:repeat(var(--n,3),1fr)}
select.plain{padding:8px 12px;border:1px solid var(--border);border-radius:8px;background:var(--card-bg);min-height:38px}

/* fixtures: copied from styles/fixtures.css */
.lt-list{display:flex;align-items:center;gap:4px;overflow-x:auto;scrollbar-width:none;padding:3px;background:var(--bg);border:1px solid var(--border);border-radius:14px}
.lt-list::-webkit-scrollbar{display:none}
.lt-tab{display:inline-flex;align-items:center;gap:7px;white-space:nowrap;min-height:38px;padding:0 13px;border:1px solid transparent;border-radius:10px;background:transparent;font-size:14px;font-weight:500;color:var(--text-muted)}
.lt-tab:hover{color:var(--text);background:var(--card-bg)}
.lt-tab[aria-selected="true"]{color:#fff;font-weight:600;background:var(--green);box-shadow:0 1px 3px rgba(29,158,117,.35)}
.lt-tab.hot[aria-selected="true"]{background:var(--red);box-shadow:0 1px 3px rgba(216,90,48,.35)}
.lt-count{font-size:11px;font-weight:600;font-variant-numeric:tabular-nums;padding:1px 6px;border-radius:99px;background:var(--border);color:var(--text-muted)}
.lt-tab[aria-selected="true"] .lt-count{background:rgba(255,255,255,.24);color:#fff}
.fixture-filters{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.fixture-filters select{padding:9px 12px;border:1px solid var(--border);border-radius:8px;background:var(--card-bg);font-size:14px;flex:1 1 140px;min-width:130px;min-height:38px}
.track-toggle{display:inline-flex;align-items:center;gap:6px;font-size:13px;padding:9px 12px;border-radius:8px;border:1px solid var(--border);background:var(--card-bg);white-space:nowrap;min-height:38px}
.track-toggle input{accent-color:var(--green);width:16px;height:16px}
.fx-group-title{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--text-muted);margin-bottom:8px;padding-bottom:6px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px}
.fx-group-title::before{content:'';width:3px;height:14px;background:var(--green);border-radius:2px;flex-shrink:0}
.fixture-card{display:flex;flex-direction:column;gap:8px;padding:12px 16px;background:var(--card-bg);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:8px}
.fixture-card:hover{box-shadow:0 2px 8px rgba(0,0,0,.1)}
.fixture-card.tracked{border-left:3px solid var(--green)}
.fixture-card.primary-home{border-left:4px solid var(--green)}
.fixture-card.dim{opacity:.62}
.fixture-card.dim:hover{opacity:.9}
.fc-main{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.fc-when{display:flex;flex-direction:column;flex-shrink:0;min-width:84px}
.fc-date{font-size:13px;font-weight:700;line-height:1.25}
.fc-time{font-size:15px;font-weight:800;color:var(--green-ink)}
.fc-teams{flex:1 1 260px;min-width:0;display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap}
.fc-side{display:inline-flex;align-items:center;gap:6px;min-width:0}
.fc-side .team{font-size:14px;font-weight:600;line-height:1.2;overflow-wrap:anywhere}
.fc-side .team.on{font-weight:800}
.fc-side .team.won{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:4px}
.fc-vs{flex-shrink:0;font-size:11px;font-weight:700;color:var(--text-muted);letter-spacing:.05em}
.fc-score{font-size:16px;font-weight:800;font-variant-numeric:tabular-nums;padding:2px 8px;background:var(--bg);border-radius:6px}
img.crest{width:26px;height:26px;object-fit:contain;flex-shrink:0}
.crest-fallback{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;background:var(--bg);border:1px solid var(--border);border-radius:4px;font-size:9px;font-weight:700;color:var(--text-muted);flex-shrink:0}
.fc-tags{display:inline-flex;align-items:center;gap:6px;flex-wrap:wrap;flex-shrink:0}
.fc-meta{font-size:11px;color:var(--text-muted);white-space:nowrap;flex-shrink:0}
.hot-badge{display:inline-flex;align-items:center;gap:3px;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:700;white-space:nowrap}
.hot-elite{background:var(--red-light);color:var(--red-ink);border:1px solid var(--red)}
.hot-high{background:var(--amber-light);color:var(--amber-ink);border:1px solid var(--amber)}
.hot-notable{background:var(--bg);color:var(--text-muted);border:1px solid var(--border)}
.hot-drop{background:#dcfce7;color:#15803d;border:1px solid #16a34a}
.fc-hot-reason{font-size:12.5px;color:var(--text-muted);font-style:italic;line-height:1.3}
.fc-stubhub{display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px;font-size:12.5px}
.spark polyline{fill:none;stroke-width:1.5;stroke-linejoin:round;stroke-linecap:round}
.spark.up polyline{stroke:#dc2626} .spark.down polyline{stroke:#16a34a}
.sh-up{color:#dc2626;font-weight:600} .sh-down{color:#16a34a;font-weight:600}
.fc-pos{background:var(--green-light);border-radius:8px;padding:7px 10px;font-size:12.5px;display:flex;flex-wrap:wrap;gap:4px 12px;align-items:center;border:0;text-align:left;width:100%;color:var(--text)}
.fc-pos b{color:var(--green-ink)}
.fc-pnl{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;padding:7px 10px;border-radius:8px;border:1px solid}
.fc-pnl.pos{background:var(--green-light);border-color:var(--green)} .fc-pnl.neg{background:var(--red-light);border-color:var(--red)}
.fc-pnl-main{font-weight:700;font-size:15px} .fc-pnl.pos .fc-pnl-main{color:var(--green-ink)} .fc-pnl.neg .fc-pnl-main{color:var(--red-ink)}
.fc-pnl-sub{font-size:12.5px;color:var(--text-muted)}
.fc-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;padding-top:8px;border-top:1px solid var(--border)}
.fc-tickets{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:12px}

/* ---------- money maths ---------- */
function balBy(tid){const o={};for(const d of S.deals)if(d.traderId===tid){const a=(d.dir==='sell'?1:-1)*openAmt(d);if(a)o[d.cur]=r2((o[d.cur]||0)+a);}for(const c in o)if(!o[c])delete o[c];return o;}
function balNet(tid){const o=balBy(tid);return r2(Object.keys(o).reduce((s,c)=>s+conv(o[c],c,CUR),0));}
const isMixed=tid=>Object.keys(balBy(tid)).some(c=>c!==CUR);
const cls=b=>b>0?'pos':b<0?'neg':'zero';
/* game P&L, all in GBP first, converted for display */
function gBase(g){
  const ds=S.deals.filter(d=>d.gameId===g.id);
  const buys=ds.filter(d=>d.dir==='buy'),sells=ds.filter(d=>d.dir==='sell');
  const ticket=(g.otherCost||0)+buys.reduce((s,d)=>s+conv(total(d),d.cur,'GBP'),0);
  const rev=g.platRev+sells.reduce((s,d)=>s+conv(total(d),d.cur,'GBP'),0);
  const share=g.partner?r2(g.partner.pct/100*ticket):0;
  const sold=g.platQty+sells.reduce((s,d)=>s+d.qty,0),bought=buys.reduce((s,d)=>s+d.qty,0);
  const missing=g.otherCost==null&&!buys.length;
  const ch=Object.assign({},g.channels);if(sells.length)ch.Traders=sells.reduce((s,d)=>s+d.qty,0);
  return{ticket,rev,share,cost:ticket+share,net:rev-ticket-share,sold,bought,missing,ch};
}
function gStats(g){const b=gBase(g),k=x=>conv(x,'GBP',CUR);return Object.assign({},b,{ticket:k(b.ticket),rev:k(b.rev),share:k(b.share),cost:k(b.cost),net:k(b.net),margin:b.rev?b.net/b.rev*100:0});}
const closedG=g=>g.date<TODAY&&!gBase(g).missing;
function partnerRows(pid){return S.games.filter(g=>g.partner&&g.partner.id===pid).map(g=>{const b=gBase(g);return{g,ticket:b.ticket,share:b.share,paid:g.partner.paid,owed:r2(b.share-g.partner.paid)};});}
function partnerOwed(pid){return r2(partnerRows(pid).reduce((s,r)=>s+Math.max(0,r.owed),0));}

/* ---------- parser (demo; the product sends text to the AI and gets this shape back) ---------- */
const NUMW={one:1,two:2,three:3,four:4,five:5,six:6,seven:7,eight:8,nine:9,ten:10,'אחד':1,'אחת':1,'שניים':2,'שתיים':2,'שני':2,'שתי':2,'שלושה':3,'שלוש':3,'ארבעה':4,'ארבע':4,'חמישה':5,'חמש':5,'שישה':6,'שש':6,'שמונה':8,'עשרה':10};
const reEsc=s=>s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
const has=(low,a)=>/^[a-z]/i.test(a)?new RegExp('(^|[^a-z])'+reEsc(a)+'([^a-z]|$)','i').test(low):low.includes(a);
const NUMRE='[£€₪]?\\s*(\\d[\\d,]*(?:\\.\\d+)?)';
function matchGame(low){
  const score=g=>g.teams.filter(al=>al.some(a=>has(low,a.toLowerCase()))).length;
  const up=S.games.filter(g=>g.teams.length);
  return{s2:up.filter(g=>score(g)===2),s1:up.filter(g=>score(g)===1)};
}
function parse(text){
  const t=String(text||''),low=t.toLowerCase();
  const r={dir:null,traderId:null,newTrader:null,gameId:null,gameOptions:[],qty:null,unit:null,paid:0,cat:'',cur:null,flags:{}};
  if(/\bsold\b|\bselling\b|\btakes?\b.*\bfrom me\b|מכרתי|מכרנו|לוקח ממני/.test(low))r.dir='sell';
  else if(/\bbought\b|\bbuying\b|\bgot\b|\btook\b|קניתי|קנינו|לקחתי/.test(low))r.dir='buy';
  if(!r.dir)r.flags.dir="Couldn't tell if you bought or sold";
  const hits=S.traders.filter(tr=>tr.aliases.some(a=>has(low,a.toLowerCase())));
  if(hits.length===1)r.traderId=hits[0].id;
  else if(hits.length>1)r.flags.trader='More than one trader mentioned, pick one';
  else{
    const mm=t.match(/\bfrom\s+([A-Z][a-z]+)/)||t.match(/\bsold\s+(?:to\s+)?([A-Z][a-z]+)/)||t.match(/\bto\s+([A-Z][a-z]+)/)||t.match(/\bwith\s+([A-Z][a-z]+)/)||t.match(/(?:קניתי|קנינו|לקחתי)\s+מ([א-ת'"]{2,})/)||t.match(/(?:מכרתי|מכרנו)\s+ל([א-ת'"]{2,})/)||t.match(/עם\s+([א-ת'"]{2,})/);
    const isTeam=w=>S.games.some(g=>g.teams.some(al=>al.some(a=>a.toLowerCase()===w.toLowerCase())));
    if(mm&&!isTeam(mm[1])){r.newTrader=mm[1];r.flags.trader='New trader, check the name';}else r.flags.trader="Couldn't tell who with";
  }
  const q=t.match(/(\d+)\s*(?:tickets?|tix|seats?|כרטיסים|כרטיס|טיקטים)/i);
  if(q)r.qty=+q[1];else{for(const w in NUMW){if(new RegExp('(^|\\s)'+w+'\\s+(?:tickets?|tix|seats?|כרטיס|טיקט)','i').test(t)){r.qty=NUMW[w];break;}}}
  if(!r.qty){const q2=t.match(/(?:^|\s)(\d{1,2})\s+[A-Za-zא-ת]/);if(q2){r.qty=+q2[1];r.flags.qty='Check the quantity';}else r.flags.qty="Couldn't find a quantity";}
  if(/£|\bpounds?\b|\bgbp\b|\bquid\b|פאונד|ליש"ט/i.test(t))r.cur='GBP';
  else if(/€|\beuros?\b|\beur\b|יורו|אירו/i.test(t))r.cur='EUR';
  else if(/₪|\bshekels?\b|\bnis\b|\bils\b|שקל|ש"ח/i.test(t))r.cur='ILS';
  const tot=t.match(new RegExp('(?:in total|total|altogether|סה"כ|סה״כ|ביחד)\\s*(?:of\\s*)?'+NUMRE,'i'));
  const pr=t.match(new RegExp('(?:\\bat|\\bfor|@)\\s*'+NUMRE,'i'))||t.match(new RegExp('(?:^|\\s)(?:ב-?|במחיר\\s*)'+NUMRE))||t.match(/[£€₪]\s*(\d[\d,]*(?:\.\d+)?)/)||t.match(/(\d[\d,]*(?:\.\d+)?)\s*(?:£|€|₪|pounds?|euros?|shekels?|יורו|אירו|שקל|ש"ח)/i);
  if(tot&&r.qty){r.unit=r2(num(tot[1])/r.qty);r.flags.unit='Worked out from the total';}
  else if(pr)r.unit=num(pr[1]);else r.flags.unit="Couldn't find a price";
  if(/paid in full|fully paid|all paid|paid up|שולם במלואו|שילם הכל|שילמתי הכל|שולם הכל/i.test(t))r.paid='full';
  else{const p=t.match(new RegExp('(?:\\bpaid|\\breceived|\\btransferred|\\bgot)\\s*(?:him|her|me|you|us)?\\s*'+NUMRE,'i'))||t.match(new RegExp('(?:שילמתי|שילם|שולם|קיבלתי|העברתי)\\s*(?:לו|לי|לנו)?\\s*'+NUMRE));if(p)r.paid=num(p[1]);}
  const c=t.match(/(?:^|[^A-Za-z])(LUC|LLC|LU|LL|SU|SL)(?![A-Za-z])/i);if(c)r.cat=c[1].toUpperCase();
  const {s2,s1}=matchGame(low);
  if(s2.length===1)r.gameId=s2[0].id;
  else if(s2.length>1||s1.length){r.gameOptions=(s2.length?s2:s1).map(g=>g.id);
    if(r.gameOptions.length===1){r.gameId=r.gameOptions[0];r.flags.game='Only one team matched, check the game';}
    else r.flags.game='More than one game fits, pick one';}
  else r.flags.game="Couldn't find the game";
  if(!r.cur){const tr=r.traderId&&trader(r.traderId);r.cur=(tr&&tr.cur)||'GBP';r.flags.cur='Not said. Using '+(tr&&tr.cur?tr.name+"'s usual":'the default')+' ('+SYM[r.cur]+')';}
  return r;
}

let toastT;
function toast(msg,undo){
  const el=$('#toast');el.innerHTML='<span>'+esc(msg)+'</span>'+(undo?'<button type="button">Undo</button>':'');el.hidden=false;
  if(undo)$('button',el).addEventListener('click',()=>{undo();el.hidden=true;});
  clearTimeout(toastT);toastT=setTimeout(()=>{el.hidden=true;},undo?5000:2800);
}
const snap=()=>JSON.stringify(S);
const restore=s=>()=>{S=JSON.parse(s);drawChrome();render();toast('Undone');};
let lastFocus=null;
function openSheet(html,mount){lastFocus=document.activeElement;$('#sheetBody').innerHTML=html;$('#scrim').hidden=false;$('#sheet').hidden=false;$('#sheet').scrollTop=0;if(mount)mount($('#sheetBody'));const f=$('#sheetBody input,#sheetBody select,#sheetBody textarea,#sheetBody button');if(f&&window.matchMedia('(min-width:1024px)').matches)f.focus();}
function closeSheet(){$('#scrim').hidden=true;$('#sheet').hidden=true;$('#sheetBody').innerHTML='';if(lastFocus&&lastFocus.isConnected)lastFocus.focus();}
$('#scrim').addEventListener('click',closeSheet);

document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#sheet').hidden)closeSheet();});
/* crest images come from football-data.org like the live board; if one fails, show the 3-letter code */
document.addEventListener('error',e=>{const t=e.target;if(t&&t.tagName==='IMG'&&t.classList.contains('crest')){const s=document.createElement('span');s.className='crest-fallback';s.textContent=t.dataset.tla||'?';t.replaceWith(s);}},true);

const VIEWS=['home','dashboard','traders','trader','partner','fixtures','import'];
let ownHash=null;
function go(view,id){
  nav={view,id:id||null};openDeal=null;openGame=null;
  const h='#/'+view+(id?'/'+encodeURIComponent(id):'');
  if(location.hash!==h){ownHash=h;try{location.hash=h;}catch(_){}}
  render();window.scrollTo(0,0);
}
function route(){
  if(ownHash&&location.hash===ownHash){ownHash=null;return;}
  const p=(location.hash||'#/home').slice(2).split('/');
  nav={view:VIEWS.includes(p[0])?p[0]:'home',id:p[1]?decodeURIComponent(p[1]):null};openDeal=null;render();window.scrollTo(0,0);
}
window.addEventListener('hashchange',route);
$('#resetBtn').addEventListener('click',()=>{const s=snap();S=seed();drawChrome();go('home');toast('Sample data reset',restore(s));});

function render(){
  markNav();
  const v=nav.view,el=$('#view');
  el.innerHTML=v==='home'?vHome():v==='dashboard'?vDashboard():v==='traders'?vTraders():v==='trader'?vTrader(nav.id):v==='partner'?vPartner(nav.id||'shadubi'):v==='fixtures'?vFixtures():vImport();
  bind(el);
}
function openMore(){
  openSheet('<h2>More</h2><div class="more-list">'+[['traders','Traders','traders'],['partner','Shadubi Debt','wallet'],['import','Import & templates','upload']].map(n=>'<button type="button" data-mv="'+n[0]+'">'+IC[n[2]]+n[1]+'</button>').join('')+
    '<button type="button" data-mrates="1">'+IC.globe+'Exchange rates</button></div>',b=>{
    $$('[data-mv]',b).forEach(x=>x.addEventListener('click',()=>{closeSheet();go(x.dataset.mv);}));
    $('[data-mrates]',b).addEventListener('click',()=>{closeSheet();openRates();});

}

/* ---------- HOME: one action, three numbers, the queue, the balances ---------- */
function statusPill(d){if(d.paid>=total(d))return '<span class="badge badge-green">Paid</span>';if(isLate(d))return '<span class="badge badge-red">Overdue</span>';if(d.paid>0)return '<span class="badge badge-amber">Part-paid</span>';return '<span class="badge badge-gray">Unpaid</span>';}
const dirLabel=d=>d.dir==='buy'?'You bought':'You sold';
function vHome(){
  let owed=0,owe=0;
  for(const t of S.traders){const b=balNet(t.id);if(b>0)owed+=b;else owe-=b;}
  const pOwe=S.partners.reduce((s,p)=>s+conv(partnerOwed(p.id),p.cur,CUR),0);owe+=pOwe;
  const late=S.deals.filter(isLate);
  const anyFx=S.deals.some(d=>openAmt(d)>0&&d.cur!==CUR)||CUR!=='GBP';const ap=anyFx?'≈':'';
  const pend=S.pending.map(p=>'<div class="card pend"><span class="org">'+esc(p.label)+'</span><q>'+esc(p.show)+'</q><div class="row"><button type="button" class="btn btn-primary btn-sm" data-review="'+esc(p.id)+'">Check &amp; confirm</button><button type="button" class="btn btn-ghost btn-sm" data-reject="'+esc(p.id)+'">Dismiss</button></div></div>').join('');
  const ready=S.pending.filter(p=>p.preset&&!Object.keys(p.preset.flags).length);
  const bals=S.traders.map(t=>({t,b:balNet(t.id),late:S.deals.filter(d=>d.traderId===t.id&&isLate(d)).length})).filter(x=>x.b!==0).sort((a,b)=>Math.abs(b.b)-Math.abs(a.b));
  const balRows=bals.map(x=>'<button type="button" class="item" data-go-trader="'+esc(x.t.id)+'"><span class="t">'+esc(x.t.name)+(x.late?'<span class="badge badge-red">'+x.late+' overdue</span>':'')+'</span><span class="v"><span class="amt bal '+cls(x.b)+'">'+(isMixed(x.t.id)?'≈':'')+fmt(Math.abs(x.b))+'</span></span><span class="s">'+(x.b>0?'owes you':'you owe')+'</span></button>').join('')+
    S.partners.map(p=>{const o=partnerOwed(p.id);return o?'<button type="button" class="item" data-view-go="partner"><span class="t">'+esc(p.name)+'<span class="badge badge-violet">'+p.pct+'% share</span></span><span class="v"><span class="amt bal neg">'+fmt(conv(o,p.cur,CUR))+'</span></span><span class="s">you owe · partner</span></button>':'';}).join('');
  return '<div class="page-header"><div><div class="page-title">Home</div><div class="page-subtitle">'+dayName(TODAY)+', '+dmy(TODAY)+'</div></div></div>'+
    '<button type="button" class="capture" data-add="voice"><span class="mic">'+IC.mic+'</span><span><strong>Closed a deal? Just say it</strong><span>Voice, a pasted WhatsApp message, or a quick form</span></span></button>'+
    '<div class="metrics-grid three">'+
      '<button type="button" class="metric-card" data-view-go="traders"><span class="label">Owed to you</span><span class="value green">'+ap+fmt(Math.round(owed))+'</span><span class="sub">by traders</span></button>'+
      '<button type="button" class="metric-card" data-view-go="traders"><span class="label">You owe</span><span class="value amber">'+ap+fmt(Math.round(owe))+'</span><span class="sub">traders + partner</span></button>'+
      '<button type="button" class="metric-card" data-jump="bals"><span class="label">Overdue</span><span class="value '+(late.length?'red':'')+'">'+late.length+'</span><span class="sub">game played, still unpaid</span></button>'+
    '</div>'+
    '<div class="home-grid"><div class="home-col">'+
      '<section id="pend"><div class="sec-h"><h2>Waiting for your OK</h2><span class="cnt">'+S.pending.length+'</span>'+(ready.length>1?'<span class="sp"></span><button type="button" class="btn btn-ghost btn-sm" id="confirmAll">Confirm all '+ready.length+' clean rows</button>':'')+'</div>'+(pend||'<div class="card empty">All clear. Everything captured is in the books.</div>')+'</section>'+
    '</div><div class="home-col">'+
      '<section id="bals"><div class="sec-h"><h2>Balances</h2><span class="sp"></span><button type="button" class="linkbtn" data-view-go="traders">All traders</button></div><div class="card list">'+(balRows||'<div class="empty">Everyone is settled.</div>')+'</div></section>'+
    '</div></div>';
}

const marginStyle=v=>{const a=Math.min(1,Math.abs(v)/60);return v>=0?'background:rgba(29,158,117,'+(0.1+a*0.35).toFixed(2)+');color:var(--green-ink)':'background:rgba(216,90,48,'+(0.1+a*0.35).toFixed(2)+');color:var(--red-ink)';};

    '<div class="metric-card"><span class="label">Avg margin</span><span class="value '+(avgM>=0?'green':'red')+'">'+avgM.toFixed(1)+'%</span></div>'+
    '<div class="metric-card"><span class="label">Tickets sold</span><span class="value">'+T.sold+'</span></div>'+
    '<div class="metric-card"><span class="label">Games</span><span class="value">'+gs.length+'</span></div></div>';
  const byDate=[...st].sort((a,b)=>b.g.date.localeCompare(a.g.date));
  const summ='<section><div class="sec-h"><span class="badge badge-green">COMPLETED</span><h2>Game Summaries</h2><span class="cnt">· '+closed.length+' games</span></div><div class="table-wrap"><table><thead><tr><th>Game</th><th>Date ▼</th><th class="n">Revenue</th><th class="n">Tickets</th><th class="n">Net profit</th><th class="n">Margin</th><th></th></tr></thead><tbody>'+

  const heat='<div class="card chart-wrap"><div class="chart-title">Margin Heatmap - best to worst</div><div class="heat">'+[...st].sort((a,b)=>b.s.margin-a.s.margin).map(({g,s})=>'<span style="'+marginStyle(s.margin)+'"><span style="color:var(--text);font-weight:600;font-size:11.5px">'+esc(g.name)+'</span><b>'+Math.round(s.margin)+'%</b><span class="num" style="font-size:11.5px">'+fmt2(s.net)+'</span></span>').join('')+'</div></div>';

  const all='<section><div class="sec-h"><h2>All games</h2><span class="cnt">· '+gs.length+'</span></div><div class="table-wrap"><table><thead><tr><th>Game</th><th>Date</th><th class="n">Tickets</th><th class="n">Revenue</th><th class="n">Costs</th><th class="n">Net profit</th><th class="n">Margin</th><th>Actions</th></tr></thead><tbody>'+
    [...gs].sort((a,b)=>b.date.localeCompare(a.date)).map(g=>{const s=gStats(g),cl=closedG(g);return '<tr><td class="g">'+esc(g.name)+'<br>'+(cl?'<span class="badge badge-green">Closed</span>':s.missing?'<span class="badge badge-amber">Missing cost</span>':'<span class="badge badge-blue">Upcoming</span>')+'</td><td class="muted">'+dmy(g.date)+'</td><td class="n">'+s.sold+'</td><td class="n">'+fmt2(s.rev)+'</td><td class="n">'+(s.missing?'-':fmt2(s.cost))+'</td><td class="n '+(s.net>=0?'pos':'neg')+'">'+(s.missing?'-':fmt2(s.net))+'</td><td class="n">'+(s.missing||!s.rev?'-':s.margin.toFixed(1)+'%')+'</td><td><button type="button" class="btn btn-ghost btn-sm" data-edit-game="'+g.id+'">'+IC.edit+'Edit</button></td></tr>';}).join('')+'</tbody></table></div></section>';
  return head+warn+metrics+summ+perfT+heat+ps+all;
}

  return '<div class="det">'+

function openGameEdit(id){
  const g=id?game(id):null;
  const pOpts='<option value="">No partner</option>'+S.partners.map(p=>'<option value="'+p.id+'"'+(g&&g.partner&&g.partner.id===p.id?' selected':'')+'>'+esc(p.name)+'</option>').join('');

    fld('eg-date','Date','<input id="eg-date" type="date" value="'+(g?g.date:'')+'">',null)+
    fld('eg-qty','Tickets sold (platforms)','<input id="eg-qty" type="number" min="0" step="1" value="'+(g?g.platQty:'')+'">',null)+
    fld('eg-rev','Revenue (platforms) £','<input id="eg-rev" type="number" min="0" step="0.01" value="'+(g?g.platRev:'')+'">',null)+
    fld('eg-cost','Ticket cost £ (not from traders)','<input id="eg-cost" type="number" min="0" step="0.01" value="'+(g&&g.otherCost!=null?g.otherCost:'')+'">',null)+
    fld('eg-p','Partner share','<select id="eg-p">'+pOpts+'</select>',null)+
    fld('eg-pct','Partner %','<input id="eg-pct" type="number" min="0" max="100" step="0.5" value="'+(g&&g.partner?g.partner.pct:25)+'">',null)+
    '</div><div class="totalline" id="eg-sum"></div><p class="err" id="eg-err" role="alert" hidden></p><div class="row"><button type="button" class="btn btn-primary" id="eg-save">Save</button><button type="button" class="btn btn-ghost" id="eg-cancel">Cancel</button></div>',b=>{
    const upd=()=>{const c=+$('#eg-cost').value||0,r=+$('#eg-rev').value||0,pc=$('#eg-p').value?(+$('#eg-pct').value||0):0;const extra=g?gBase(Object.assign({},g,{otherCost:0,platRev:0,partner:null})):{ticket:0,rev:0};
      const tc=c+extra.ticket,share=tc*pc/100,net=r+extra.rev-tc-share;$('#eg-sum').innerHTML='<span>Cost '+m(conv(tc+share,'GBP',CUR))+(pc?' incl. '+pc+'% share':'')+'</span><span class="'+(net>=0?'pos':'neg')+'">Net '+m(conv(net,'GBP',CUR))+'</span>';};
    $$('input,select',b).forEach(x=>x.addEventListener('input',upd));upd();
    $('#eg-cancel',b).addEventListener('click',closeSheet);
    $('#eg-save',b).addEventListener('click',()=>{
      const name=$('#eg-name').value.trim(),date=$('#eg-date').value,qty=$('#eg-qty').value,rev=$('#eg-rev').value,cost=$('#eg-cost').value,pid=$('#eg-p').value,pct=+$('#eg-pct').value,e=$('#eg-err');
      const err=[];if(name.length<3)err.push('a game name');if(!/^\d{4}-\d{2}-\d{2}$/.test(date))err.push('a date');
      if(qty!==''&&!(Number.isInteger(+qty)&&+qty>=0))err.push('a whole number of tickets');if(rev!==''&&!(+rev>=0))err.push('revenue of 0 or more');if(cost!==''&&!(+cost>=0))err.push('cost of 0 or more');
      if(pid&&!(pct>0&&pct<=100))err.push('a partner % between 0 and 100');
      if(err.length){e.textContent='Needs '+err.join(', ')+'.';e.hidden=false;return;}
      if(S.games.some(x=>x!==g&&x.name.toLowerCase()===name.toLowerCase()&&x.date===date)){e.textContent='This game already exists on that date. Edit it instead.';e.hidden=false;return;}
      const s=snap();
      const t=g||{id:'g'+Date.now(),teams:[],channels:{},partner:null};
      const words=name.toLowerCase().split(/\s+vs\.?\s+|\s+-\s+/);if(!g)t.teams=words.slice(0,2).map(w=>[w.trim()]);
      Object.assign(t,{name,date,platQty:qty===''?0:+qty,platRev:rev===''?0:+rev,otherCost:cost===''?null:+cost});
      t.partner=pid?{id:pid,pct,paid:t.partner&&t.partner.id===pid?Math.min(t.partner.paid,999999):0}:null;
      if(!g)S.games.push(t);
      closeSheet();render();toast(g?'Game updated':'Game added',restore(s));
    });
  });
}

/* ---------- PARTNER (like the Eli tab: share of ticket cost, paid, owed) ---------- */
function vPartner(pid){
  const p=partner(pid);if(!p)return '<div class="empty">No partner</div>';
  const rows=partnerRows(pid).sort((a,b)=>b.g.date.localeCompare(a.g.date));
  const c=r2(rows.reduce((s,r)=>s+r.share,0)),pd=r2(rows.reduce((s,r)=>s+r.paid,0)),ow=r2(c-pd);
  const unpaid=rows.filter(r=>r.owed>0.005),paidRows=rows.filter(r=>r.owed<=0.005);

  return '<svg class="spark '+(pts[pts.length-1]>pts[0]?'up':'down')+'" width="'+W+'" height="'+H+'" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="14-day trend: '+fmt(conv(pts[0],'GBP',CUR))+' to '+fmt(conv(pts[pts.length-1],'GBP',CUR))+'"><polyline points="'+d+'"/></svg>';

const csvCell=v=>/[",\n]/.test(v)?'"'+String(v).replace(/"/g,'""')+'"':String(v);

function parseCsv(text){
  const rows=[];let row=[],cell='',q=false;
  for(let i=0;i<text.length;i++){const ch=text[i];
    if(q){if(ch==='"'){if(text[i+1]==='"'){cell+='"';i++;}else q=false;}else cell+=ch;}
    else if(ch==='"')q=true;else if(ch===','||ch===';'||ch==='\t'){row.push(cell);cell='';}
    else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&text[i+1]==='\n')i++;row.push(cell);rows.push(row);row=[];cell='';}
    else cell+=ch;}
  if(cell!==''||row.length){row.push(cell);rows.push(row);}
  return rows.filter(r=>r.some(c=>String(c).trim()!==''));
}
/* strict: 31/02 is rejected, not rolled over to March */
function realDate(y,mo,d){const dt=new Date(Date.UTC(+y,+mo-1,+d));return dt.getUTCFullYear()===+y&&dt.getUTCMonth()===+mo-1&&dt.getUTCDate()===+d?y+'-'+String(mo).padStart(2,'0')+'-'+String(d).padStart(2,'0'):null;}
function isoDate(s){s=String(s).trim();let m2=s.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{4})$/);if(m2)return realDate(m2[3],m2[2],m2[1]);m2=s.match(/^(\d{4})-(\d{2})-(\d{2})$/);return m2?realDate(m2[1],m2[2],m2[3]):null;}
const isNum=v=>/^\d+(\.\d+)?$/.test(String(v).replace(/,/g,'').trim());
function findGame(name){const low=String(name).toLowerCase().trim();const ex=S.games.filter(g=>g.name.toLowerCase()===low);if(ex.length===1)return ex[0];const {s2}=matchGame(low);return s2.length===1?s2[0]:null;}
function findTrader(name){const low=String(name).toLowerCase().trim();return S.traders.find(t=>t.name.toLowerCase()===low||t.aliases.includes(low))||null;}
/* Validate rows against a template. Returns {headerOk, missing[], rows:[{n,cells,errors[],obj}]} */
function checkRows(kind,table){
  const T=TPL[kind];const hdr=(table[0]||[]).map(h=>String(h).trim().toLowerCase());
  const idx=T.cols.map(c=>hdr.indexOf(c.toLowerCase()));
  const optional=kind==='deals'?['Category']:['Partner','Partner %'];
  const missing=T.cols.filter((c,i)=>idx[i]<0&&!optional.includes(c));
  if(missing.length)return{headerOk:false,missing,rows:[]};
  const get=(r,c)=>{const i=idx[T.cols.indexOf(c)];return i<0?'':String(r[i]==null?'':r[i]).trim();};
  const rows=table.slice(1,2001).map((r,i)=>{const e=[],n=i+2;
    const date=isoDate(get(r,'Date'));if(!date)e.push('date not DD/MM/YYYY');
    const cur=get(r,'Currency').toUpperCase();if(!CURS.includes(cur))e.push('currency must be GBP, EUR or ILS');
    if(kind==='deals'){
      const type=get(r,'Type').toLowerCase();if(!['buy','sell'].includes(type))e.push('type must be Buy or Sell');
      const g=findGame(get(r,'Game'));if(!g)e.push('game "'+get(r,'Game')+'" not found');
      const tname=get(r,'Trader');if(tname.length<2)e.push('trader missing');
      const qty=get(r,'Qty');if(!/^\d+$/.test(qty)||+qty<1)e.push('qty must be a whole number');
      const unit=get(r,'Price each');if(!isNum(unit)||num(unit)<=0)e.push('price must be a number');
      const paid=get(r,'Paid')||'0';if(!isNum(paid))e.push('paid must be a number');
      if(!e.length&&num(paid)>qty*num(unit))e.push('paid is more than the total');
      return{n,cells:T.cols.map(c=>get(r,c)),errors:e,obj:e.length?null:{date,dir:type,trader:tname,gameId:g.id,qty:+qty,unit:num(unit),cur,paid:num(paid),cat:get(r,'Category').toUpperCase().slice(0,12)}};
    }
    const name=get(r,'Game');if(name.length<3)e.push('game name missing');
    const sold=get(r,'Tickets sold');if(!/^\d+$/.test(sold))e.push('tickets sold must be a whole number');
    const rev=get(r,'Revenue'),cost=get(r,'Ticket cost');if(!isNum(rev))e.push('revenue must be a number');if(!isNum(cost))e.push('ticket cost must be a number');
    const pn=get(r,'Partner'),pp=get(r,'Partner %');let pid=null;
    if(pn){const p=S.partners.find(x=>x.name.toLowerCase()===pn.toLowerCase());if(!p)e.push('partner "'+pn+'" unknown');else pid=p.id;if(!isNum(pp)||num(pp)<=0||num(pp)>100)e.push('partner % must be 1-100');}
    return{n,cells:T.cols.map(c=>get(r,c)),errors:e,obj:e.length?null:{date,name,sold:+sold,rev:conv(num(rev),cur,'GBP'),cost:conv(num(cost),cur,'GBP'),pid,pct:pid?num(pp):0}};
  });
  return{headerOk:true,missing:[],rows};
}

function readFile(file){
  return new Promise((res,rej)=>{
    if(file.size>5*1024*1024)return rej(new Error('File is over 5 MB. Split it, or send it to us.'));
    const ext=(file.name.split('.').pop()||'').toLowerCase();
    if(ext==='csv'||ext==='txt'){const fr=new FileReader();fr.onload=()=>res(parseCsv(String(fr.result).replace(/^﻿/,'')));fr.onerror=()=>rej(new Error('Could not read the file.'));fr.readAsText(file);}
    else if(ext==='xlsx'||ext==='xls'){loadXlsx().then(X=>{const fr=new FileReader();fr.onload=()=>{try{const wb=X.read(new Uint8Array(fr.result),{type:'array'});const ws=wb.Sheets[wb.SheetNames[0]];res(X.utils.sheet_to_json(ws,{header:1,raw:false,defval:''}));}catch(_){rej(new Error('Could not read this Excel file.'));}};fr.readAsArrayBuffer(file);}).catch(()=>rej(new Error('Excel reader could not load. Save the sheet as CSV and try again.')));}
    else rej(new Error('Use a .csv or .xlsx file.'));
  });
}

  const cm=$('[data-commit]',target);if(cm)cm.addEventListener('click',()=>commitRows(kind,res,source));
  const mn=$('[data-map-now]',target);if(mn)mn.addEventListener('click',()=>showMapping(target,table,kind,source));
}
function bindImport(el){
  $$('[data-tpl]',el).forEach(b=>b.addEventListener('click',()=>{src.tpl=b.dataset.tpl;$$('[data-tpl]',el).forEach(x=>x.setAttribute('aria-selected',String(x===b)));$('#tplArea').innerHTML=tplBlock(src.tpl);$('#upKind').value=src.tpl;bindCopy(el);}));
  bindCopy(el);
  const inp=$('#upFile',el),drop=$('#drop',el),out=$('#upOut',el);
  const handle=f=>{if(!f)return;out.innerHTML='<p class="fine">Reading '+esc(f.name)+'...</p>';readFile(f).then(tbl=>{if(!tbl.length){out.innerHTML='<p class="err">The file is empty.</p>';return;}showResult(out,$('#upKind').value,tbl,'File "'+f.name+'"');}).catch(e=>{out.innerHTML='<p class="err" role="alert">'+esc(e.message)+'</p>';});};
  inp.addEventListener('change',()=>{handle(inp.files[0]);inp.value='';});
  ['dragenter','dragover'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.add('over');}));
  ['dragleave','drop'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.remove('over');}));
  drop.addEventListener('drop',e=>handle(e.dataTransfer.files[0]));
  $('#manGame',el).addEventListener('click',()=>openGameEdit(null));
  $('#manPartner',el).addEventListener('click',()=>openPartnerAdd(S.partners[0].id));
  const SAMPLE='https://docs.google.com/spreadsheets/d/1aB2cD3eF4gH5iJ6kL7mN8oP9qR0sT/edit';
  $('#sheetSample',el).addEventListener('click',()=>{$('#sheetUrl').value=SAMPLE;});
  $('#sheetGo',el).addEventListener('click',()=>{
    const u=$('#sheetUrl').value.trim(),err=$('#sheetErr');
    if(!/^https:\/\/docs\.google\.com\/spreadsheets\/d\/[\w-]{10,}/.test(u)){err.textContent="That doesn't look like a Google Sheets link. It should start with docs.google.com/spreadsheets/d/";err.hidden=false;return;}
    err.hidden=true;src.sheet=u;src.sheetKind=$('#shKind').value;
    const area=$('#mapArea');area.innerHTML='<p class="ok">Connected to "Deals 2026" (sample).</p><p class="err">Its columns do not follow the template (Supplier, Match, Price...).</p><div></div>';
    showMapping(area.lastElementChild,SHEET_TBL,src.sheetKind,'Google Sheet "Deals 2026"');
  });
  const dg=$('#driveGo',el);if(dg)dg.addEventListener('click',openDriveConsent);
  $$('[data-dfile]',el).forEach(b=>b.addEventListener('click',()=>{const i=+b.dataset.dfile,f=src.driveFiles[i],kind=$('#dk'+i).value;f.kind=kind;const out=$('#driveOut');
    const tbl=f.match?[TPL[kind].cols,...TPL[kind].ex]:SHEET_TBL;out.innerHTML='<p class="fine"><b>'+esc(f.name)+'</b></p><div></div>';showResult(out.lastElementChild,kind,tbl,'Drive "'+f.name+'"');}));
  $$('[data-mail]',el).forEach(b=>b.addEventListener('click',()=>{src.mail[b.dataset.mail]=true;render();toast('Connected. New sales will wait for your OK');}));
  $('#waNotify',el).addEventListener('click',()=>{src.waNotify=true;render();toast("We'll let you know");});
}
function bindCopy(el){$$('[data-copyhdr]',el).forEach(b=>b.onclick=()=>{const t=TPL[b.dataset.copyhdr].cols.join('\t');try{navigator.clipboard.writeText(t).then(()=>toast('Header row copied - paste it into row 1 of your sheet'),()=>toast(t));}catch(_){toast(t);}});}
function openDriveConsent(){

function setPartnerPaid(gid,val,mode){
  const g=game(gid),p=partner(g.partner.id),share=gBase(g).share;
  if(mode!=='settle'&&!(val>0||(mode==='set'&&val===0))){toast('Enter an amount above zero');return;}
  const s=snap();
  const next=mode==='settle'?share:mode==='add'?g.partner.paid+val:val;
  if(next>share+0.005){toast('That is more than '+p.name+"'s share ("+fmt2(share,p.cur)+')');return;}
  g.partner.paid=r2(Math.max(0,next));render();toast((mode==='settle'?'Settled':'Payment saved')+' · '+g.name,restore(s));
}

function fld(id,label,control,flag,wide){return '<label class="fld'+(flag?' flag':'')+(wide?' wide':'')+'" for="'+id+'">'+label+control+(flag?'<em>'+esc(flag)+'</em>':'')+'</label>';}
const curOpts=sel=>CURS.map(c=>'<option value="'+c+'"'+(c===sel?' selected':'')+'>'+SYM[c]+' '+c+'</option>').join('');
function saveDeal(v,source,pendingId){
  let tid=v.traderId;
  if(!tid||tid==='__new'){const name=(v.newTrader||'').trim();const ex=S.traders.find(t=>t.name.toLowerCase()===name.toLowerCase());if(ex)tid=ex.id;else{tid='t'+Date.now()+Math.floor(Math.random()*1e4);S.traders.push({id:tid,name,aliases:[name.toLowerCase()],note:'New trader',cur:v.cur});}}
  const d={id:'d'+Date.now()+Math.floor(Math.random()*1e4),traderId:tid,dir:v.dir,gameId:v.gameId,qty:v.qty,unit:v.unit,cur:v.cur,paid:v.paid||0,cat:v.cat||'',date:v.date||TODAY,delivered:false,src:{label:source.label,text:source.show||''}};
  S.deals.push(d);
  if(d.paid>0)S.payments.push({traderId:tid,dir:d.dir==='buy'?'out':'in',amount:d.paid,cur:d.cur,date:d.date});
  if(pendingId)S.pending=S.pending.filter(x=>x.id!==pendingId);
  return d;
}
function openConfirm(text,source,pendingId,defTrader,manual,preset){
  const dt=defTrader&&trader(defTrader);
  const p=preset?JSON.parse(JSON.stringify(preset)):manual?{dir:null,traderId:defTrader,newTrader:null,gameId:null,gameOptions:[],qty:null,unit:null,paid:0,cat:'',cur:(dt&&dt.cur)||'GBP',flags:{}}:parse(text);
  if(!manual&&!preset&&!p.traderId&&!p.newTrader&&defTrader){p.traderId=defTrader;delete p.flags.trader;if(p.flags.cur&&dt.cur){p.cur=dt.cur;p.flags.cur='Not said. Using '+dt.name+"'s usual ("+SYM[dt.cur]+')';}}
  const paid0=p.paid==='full'?(p.qty&&p.unit?p.qty*p.unit:0):(p.paid||0);
  const F=p.flags;
  const trOpts='<option value="">Pick a trader</option>'+(p.newTrader?'<option value="__new" selected>+ New trader: '+esc(p.newTrader)+'</option>':'')+S.traders.map(t=>'<option value="'+esc(t.id)+'"'+(t.id===p.traderId?' selected':'')+'>'+esc(t.name)+'</option>').join('');
  const gs=[...S.games].sort((a,b)=>b.date.localeCompare(a.date));
  const gOpt=g=>'<option value="'+g.id+'"'+(g.id===p.gameId?' selected':'')+'>'+esc(g.name)+' · '+dm(g.date)+'</option>';
  const gameOpts='<option value="">Pick a game</option>'+(p.gameOptions.length>1?'<optgroup label="Matches the message">'+gs.filter(g=>p.gameOptions.includes(g.id)).map(gOpt).join('')+'</optgroup><optgroup label="All games">'+gs.filter(g=>!p.gameOptions.includes(g.id)).map(gOpt).join('')+'</optgroup>':gs.map(gOpt).join(''));
  openSheet('<h2>'+(manual?'Add a deal':'Confirm this deal?')+'</h2>'+
    (manual?'':'<blockquote class="src"'+(/[א-ת]/.test(source.show||text)?' dir="rtl"':'')+'><span>'+esc(source.label)+'</span>'+esc(source.show||text)+'</blockquote>'+(Object.keys(F).length?'<p class="fine">Anything I was unsure about is in orange. Fix it and confirm.</p>':'<p class="fine">Got everything. Check and confirm.</p>'))+
    '<div class="fields">'+
      fld('f-dir','Type','<select id="f-dir"><option value="">Pick</option><option value="buy"'+(p.dir==='buy'?' selected':'')+'>Bought (from them)</option><option value="sell"'+(p.dir==='sell'?' selected':'')+'>Sold (to them)</option></select>',F.dir)+
      fld('f-trader','Trader','<select id="f-trader">'+trOpts+'</select>',F.trader)+
      fld('f-game','Game','<select id="f-game">'+gameOpts+'</select>',F.game,true)+
      fld('f-qty','Quantity','<input id="f-qty" type="number" inputmode="numeric" min="1" step="1" value="'+(p.qty||'')+'">',F.qty)+
      fld('f-cur','Currency','<select id="f-cur">'+curOpts(p.cur)+'</select>',F.cur)+
      fld('f-unit','Price per ticket','<input id="f-unit" type="number" inputmode="decimal" min="0" step="0.01" value="'+(p.unit||'')+'">',F.unit)+
      fld('f-paid','Paid so far','<input id="f-paid" type="number" inputmode="decimal" min="0" step="0.01" value="'+(paid0||0)+'">',null)+
      fld('f-cat','Category','<input id="f-cat" type="text" maxlength="12" placeholder="LU, SL..." value="'+esc(p.cat)+'">',null,true)+
    '</div><div class="totalline" id="f-total"></div><p class="err" id="f-err" role="alert" hidden></p>'+
    '<div class="row"><button type="button" class="btn btn-primary" id="f-save">Confirm &amp; save</button><button type="button" class="btn btn-ghost" id="f-cancel">Cancel</button></div><p class="fine">Nothing enters the books without your OK.</p>',b=>{
    const upd=()=>{const q=+$('#f-qty').value||0,u=+$('#f-unit').value||0,pd=+$('#f-paid').value||0,c=$('#f-cur').value,tt=q*u;$('#f-total').innerHTML='<span>Total '+mo(tt,c)+'</span><span>'+(tt?(pd>=tt?'Paid in full':'Open '+m(Math.max(0,tt-pd),c)):'')+'</span>';};
    const clearFlag=x=>{const l=x.closest('.fld');if(l){l.classList.remove('flag');const e=l.querySelector('em');if(e)e.remove();}};
    $$('input,select',b).forEach(x=>x.addEventListener('input',()=>{clearFlag(x);upd();}));
    $('#f-trader').addEventListener('change',()=>{const cf=$('#f-cur').closest('.fld');const t=trader($('#f-trader').value);if(cf.classList.contains('flag')&&t&&t.cur){$('#f-cur').value=t.cur;const em=cf.querySelector('em');if(em)em.textContent='Not said. Using '+t.name+"'s usual ("+SYM[t.cur]+')';upd();}});
    upd();
    $('#f-cancel',b).addEventListener('click',closeSheet);
    $('#f-save',b).addEventListener('click',()=>{
      const dir=$('#f-dir').value,tv=$('#f-trader').value,gid=$('#f-game').value,q=+$('#f-qty').value,u=+$('#f-unit').value,pd=+$('#f-paid').value||0,cur=$('#f-cur').value,cat=$('#f-cat').value.trim().toUpperCase().slice(0,12);
      const miss=[];if(!dir)miss.push('type');if(!tv)miss.push('trader');if(!gid)miss.push('game');if(!(q>0&&Number.isInteger(q)))miss.push('quantity');if(!(u>0))miss.push('price');if(!CURS.includes(cur))miss.push('currency');
      const e=$('#f-err');
      if(miss.length){e.textContent='Missing: '+miss.join(', ')+'.';e.hidden=false;const first={type:'#f-dir',trader:'#f-trader',game:'#f-game',quantity:'#f-qty',price:'#f-unit'}[miss[0]];if(first)$(first).focus();return;}
      if(pd<0||pd>q*u){e.textContent='Paid cannot be more than the deal total ('+fmt(q*u,cur)+').';e.hidden=false;$('#f-paid').focus();return;}
      const s=snap();
      const d=saveDeal({dir,traderId:tv,newTrader:p.newTrader,gameId:gid,qty:q,unit:u,paid:pd,cat,cur,date:p.date},{label:source.label,show:manual?'':(source.show||text)},pendingId);
      closeSheet();drawChrome();go('trader',d.traderId);openDeal=d.id;render();toast('Saved to '+trader(d.traderId).name+"'s book",restore(s));
    });
  });
}
function openPay(tid,deal){
  const t=trader(tid);
  const openDs=()=>S.deals.filter(d=>d.traderId===tid&&openAmt(d)>0);
  let dir=deal?(deal.dir==='buy'?'out':'in'):null;
  if(!dir){const o=openDs(),sum=k=>o.filter(d=>d.dir===k).reduce((s,d)=>s+conv(openAmt(d),d.cur,'GBP'),0);dir=sum('buy')>=sum('sell')?'out':'in';}
  const inDir=()=>deal?[deal]:openDs().filter(d=>d.dir===(dir==='out'?'buy':'sell'));
  const targets=c=>inDir().sort((a,b)=>(a.cur===c?0:1)-(b.cur===c?0:1)||a.date.localeCompare(b.date));
  const defCur=()=>deal?deal.cur:((inDir().sort((a,b)=>a.date.localeCompare(b.date))[0]||{}).cur||t.cur||'GBP');
  let cur=defCur();
  const limit=c=>r2(targets(c).reduce((s,d)=>s+conv(openAmt(d),d.cur,c),0));
  const openTxt=()=>{const o={};inDir().forEach(d=>{o[d.cur]=r2((o[d.cur]||0)+openAmt(d));});return Object.keys(o).map(c=>fmt(o[c],c)).join(' + ')||fmt(0,cur);};
  const draw=()=>{
    openSheet('<h2>Record payment</h2>'+(deal?'<p class="fine">For: '+esc(game(deal.gameId).name)+' · open '+m(openAmt(deal),deal.cur)+'</p>':
      '<div class="tabs3 two" role="tablist"><button type="button" role="tab" data-d="out" aria-selected="'+(dir==='out')+'">I paid '+esc(t.name)+'</button><button type="button" role="tab" data-d="in" aria-selected="'+(dir==='in')+'">'+esc(t.name)+' paid me</button></div><p class="fine">Open this way: <b class="num">'+openTxt()+'</b>. Applied to open deals oldest first.</p>')+
      '<div class="fields">'+fld('p-amt','Amount','<input id="p-amt" type="number" inputmode="decimal" min="0" step="0.01" value="'+(limit(cur)||'')+'">',null)+fld('p-cur','Currency','<select id="p-cur">'+curOpts(cur)+'</select>',null)+'</div>'+
      '<p class="fine" id="p-conv"></p><p class="err" id="p-err" role="alert" hidden></p><div class="row"><button type="button" class="btn btn-primary" id="p-save">Record</button><button type="button" class="btn btn-ghost" id="p-cancel">Cancel</button></div>',b=>{
      const convNote=()=>{const c=$('#p-cur').value,a=+$('#p-amt').value||0;const other=[...new Set(targets(c).map(d=>d.cur))].filter(x=>x!==c);
        $('#p-conv').innerHTML='Max '+m(limit(c),c)+'.'+(other.length?' Paying in '+SYM[c]+' against '+other.map(x=>SYM[x]).join('/')+' deals: converted at the Bank of Israel rate'+(a?', '+fmt(a,c)+' = '+other.map(x=>fmt(conv(a,c,x),x)).join(' = '):'')+'.':'');};
      $$('[data-d]',b).forEach(x=>x.addEventListener('click',()=>{dir=x.dataset.d;cur=defCur();draw();}));
      $('#p-cur',b).addEventListener('change',()=>{$('#p-amt').value=limit($('#p-cur').value)||'';convNote();});
      $('#p-amt',b).addEventListener('input',convNote);convNote();
      $('#p-cancel',b).addEventListener('click',closeSheet);
      $('#p-save',b).addEventListener('click',()=>{
        const a=+$('#p-amt').value,c=$('#p-cur').value,e=$('#p-err');
        if(!(a>0)){e.textContent='Enter an amount above zero.';e.hidden=false;$('#p-amt').focus();return;}
        if(a>limit(c)+0.009){e.textContent='That is more than what is open ('+fmt(limit(c),c)+'). Check the amount or the direction.';e.hidden=false;$('#p-amt').focus();return;}
        const s=snap();let left=a;const notes=[];
        for(const d of targets(c)){if(left<=0.004)break;const openIn=conv(openAmt(d),d.cur,c);const take=Math.min(left,openIn);
          d.paid=r2(d.paid+conv(take,c,d.cur));if(openAmt(d)<0.01)d.paid=total(d);if(d.cur!==c)notes.push(fmt(take,c)+' → '+fmt(conv(take,c,d.cur),d.cur));left-=take;}
        S.payments.push({traderId:tid,dir,amount:a,cur:c,date:TODAY,note:notes.length?'converted at BoI rate: '+notes.join(', '):''});
        closeSheet();render();toast('Payment of '+fmt(a,c)+' recorded',restore(s));
      });
    });
  };
  draw();
}
function summaryText(tid){
  const t=trader(tid),o=balBy(tid);const [y,mo2,d]=TODAY.split('-');
  const ds=S.deals.filter(x=>x.traderId===tid&&openAmt(x)>0).sort((a,c)=>a.date.localeCompare(c.date));
  const line=x=>'• '+dm(x.date)+' '+game(x.gameId).name+', '+x.qty+' × '+fmt(x.unit,x.cur)+' = '+fmt(total(x),x.cur)+(x.paid?', paid '+fmt(x.paid,x.cur):'')+', open '+fmt(openAmt(x),x.cur);
  const buys=ds.filter(x=>x.dir==='buy'),sells=ds.filter(x=>x.dir==='sell');
  let s='Hi '+t.name+', here is what is open between us as of '+d+'/'+mo2+'/'+y+':\n';
  if(buys.length)s+='\nI bought from you:\n'+buys.map(line).join('\n')+'\n';
  if(sells.length)s+='\nI sold to you:\n'+sells.map(line).join('\n')+'\n';
  const ks=Object.keys(o);
  s+='\n'+(ks.length?'Balance: '+ks.map(c=>o[c]>0?'you owe me '+fmt(o[c],c):'I owe you '+fmt(-o[c],c)).join(', and '):'We are all square')+'.\nIf anything does not match, tell me and we will check.';
  return s;
}
function openSummary(tid){
  const s=summaryText(tid);
  openSheet('<h2>Statement for '+esc(trader(tid).name)+'</h2><p class="fine">Ready to send on WhatsApp. You send it yourself. Each debt is listed in its own currency.</p><textarea id="sumText" readonly style="min-height:240px">'+esc(s)+'</textarea>'+
    '<div class="row"><button type="button" class="btn btn-primary" id="sumCopy">'+IC.copy+'Copy</button><a class="btn btn-ghost" href="https://wa.me/?text='+encodeURIComponent(s)+'" target="_blank" rel="noopener">'+IC.send+'Open in WhatsApp</a></div>',b=>{
    $('#sumCopy',b).addEventListener('click',()=>{const ta=$('#sumText');const fb=()=>{ta.focus();ta.select();toast('Text selected, copy it');};try{navigator.clipboard.writeText(ta.value).then(()=>toast('Copied'),fb);}catch(_){fb();}});
  });
}
function openNewTrader(){
  openSheet('<h2>New trader</h2><div class="fields">'+fld('nt-name','Name','<input id="nt-name" type="text" maxlength="40" autocomplete="off">',null,true)+fld('nt-note','Note','<input id="nt-note" type="text" maxlength="60" placeholder="Supplier, buyer, area">',null)+fld('nt-cur','Usual currency','<select id="nt-cur">'+curOpts('GBP')+'</select>',null)+'</div><p class="err" id="nt-err" role="alert" hidden></p><div class="row"><button type="button" class="btn btn-primary" id="nt-save">Add</button><button type="button" class="btn btn-ghost" id="nt-cancel">Cancel</button></div>',b=>{
    $('#nt-cancel',b).addEventListener('click',closeSheet);
    $('#nt-save',b).addEventListener('click',()=>{const n=$('#nt-name').value.trim(),e=$('#nt-err');
      if(n.length<2){e.textContent='Enter a name of at least 2 letters.';e.hidden=false;return;}
      if(S.traders.some(t=>t.name.toLowerCase()===n.toLowerCase())){e.textContent='There is already a trader with this name.';e.hidden=false;return;}
      const id='t'+Date.now();S.traders.push({id,name:n,aliases:[n.toLowerCase()],note:$('#nt-note').value.trim(),cur:$('#nt-cur').value});closeSheet();go('trader',id);toast('Added '+n);});
  });
}

/* Template download goes through the viewer's downloads capability (plain download links are blocked in the artifact viewer). */
document.addEventListener('click',async e=>{
  const b=e.target.closest&&e.target.closest('[data-dl]');if(!b)return;
  const k=b.dataset.dl,T=TPL[k];
  let dl=null;try{dl=window.claude&&await window.claude.use('downloads');}catch(_){dl=null;}
  if(!dl){toast('Download is not available here. Use "Copy the header row" instead.');return;}
  try{await dl.save({filename:T.file,data:'﻿'+tplCsv(k)});toast('Template saved');}
  catch(err){const c=err&&err.code;if(c==='declined')return;toast(c==='rate_limited'?'A download prompt is already open':'Could not save the file here. Use "Copy the header row" instead.');}
});

drawChrome();
route();
})();
</script>
