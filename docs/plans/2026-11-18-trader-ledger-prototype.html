<title>Trader Ledger</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Layout: phone = top bar + one column + bottom nav with a raised "+".
   Desktop (>=1024px) = dark sidebar like the live GameYield dashboard, wide content, centred dialogs.
   Colours follow the live dashboard (index.css), darkened where needed for AA contrast. */
:root{
  --bg:#f4f6fb; --surface:#ffffff; --ink:#1a202c; --muted:#5b6678; --line:#e2e8f0;
  --accent:#15795b; --on-accent:#ffffff; --accent-soft:#e6f5ef;
  --pos:#15795b; --pos-soft:#e6f5ef; --neg:#9a5f0f; --neg-soft:#fdf3e3; --bad:#b8461f; --bad-soft:#fdeee8;
  --side:#1a1d27; --side-ink:#a0aec0; --side-on:#ffffff;
  --shadow:0 1px 3px rgba(0,0,0,.08),0 8px 28px rgba(15,23,42,.10);
  --f:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11141b; --surface:#1a1e28; --ink:#e5e9f0; --muted:#9aa5b8; --line:#2b3140;
  --accent:#3fc59a; --on-accent:#06231a; --accent-soft:#16302a;
  --pos:#4fd1a5; --pos-soft:#16302a; --neg:#f0b25a; --neg-soft:#33280f; --bad:#f2896a; --bad-soft:#3a2019;
  --side:#0b0d12; --shadow:0 8px 28px rgba(0,0,0,.5); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11141b; --surface:#1a1e28; --ink:#e5e9f0; --muted:#9aa5b8; --line:#2b3140;
  --accent:#3fc59a; --on-accent:#06231a; --accent-soft:#16302a;
  --pos:#4fd1a5; --pos-soft:#16302a; --neg:#f0b25a; --neg-soft:#33280f; --bad:#f2896a; --bad-soft:#3a2019;
  --side:#0b0d12; --shadow:0 8px 28px rgba(0,0,0,.5); color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 var(--f);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button,a,select,label.chk{cursor:pointer;touch-action:manipulation}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum";white-space:nowrap}
h1,h2,h3,h4{margin:0;line-height:1.25;text-wrap:balance}
svg.i{width:18px;height:18px;flex:none}
[hidden]{display:none!important}

/* top bar */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.top-in{max-width:620px;margin:0 auto;display:flex;align-items:center;gap:10px;padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{font-weight:700;font-size:1.08rem;letter-spacing:-.01em}
.brand b{color:var(--accent)}
.demo-chip{font-size:.7rem;font-weight:600;background:var(--neg-soft);color:var(--neg);padding:2px 8px;border-radius:99px;white-space:nowrap}
.sp{flex:1}
.curseg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px}
.curseg button{border:0;background:none;min-width:40px;height:34px;border-radius:7px;font-weight:600;color:var(--muted)}
.curseg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.linkbtn{background:none;border:0;color:var(--accent);font-weight:600;padding:8px 4px;text-decoration:none}

/* sidebar (desktop only) */
aside.side{display:none;position:fixed;inset:0 auto 0 0;width:236px;background:var(--side);color:var(--side-ink);flex-direction:column;gap:6px;padding:20px 14px;z-index:25}
aside.side .brand{color:#fff;padding:0 10px 14px;font-size:1.2rem}
aside.side .brand b{color:#3fc59a}
aside.side nav{display:flex;flex-direction:column;gap:2px}
aside.side nav button{display:flex;gap:12px;align-items:center;background:none;border:0;border-radius:10px;padding:10px 12px;color:var(--side-ink);font-weight:500;text-align:left}
aside.side nav button:hover{background:rgba(255,255,255,.06);color:#fff}
aside.side nav button[aria-current="page"]{background:rgba(255,255,255,.10);color:var(--side-on)}
aside.side .newdeal{margin:10px 4px;background:#1D9E75;color:#fff;border:0;border-radius:10px;padding:11px 12px;font-weight:600;display:flex;gap:8px;align-items:center;justify-content:center}
aside.side .ratebox{margin-top:auto;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);border-radius:10px;padding:10px 12px;font-size:.8rem;text-align:left;color:var(--side-ink)}
aside.side .ratebox b{color:#fff;font-weight:600}

main{max-width:620px;margin:0 auto;padding-block:16px calc(112px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:24px}
section{display:flex;flex-direction:column;gap:10px;min-width:0}
.sec-h{display:flex;align-items:baseline;gap:8px}
.sec-h h2{font-size:1.02rem;font-weight:600}
.sec-h .cnt{font-size:.78rem;font-weight:600;color:var(--muted);background:var(--line);border-radius:99px;padding:0 7px}
.muted{color:var(--muted)}
.fine{font-size:.86rem;color:var(--muted);margin:0}
.page-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.page-h h1{font-size:1.4rem;font-weight:700;flex:1;min-width:10ch}
.page-h .sub{flex-basis:100%;margin:0;color:var(--muted);font-size:.88rem}

.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;text-align:left;display:flex;flex-direction:column;gap:2px;box-shadow:var(--shadow)}
.tile .lbl{font-size:.84rem;color:var(--muted);font-weight:500}
.tile .val{font-size:1.45rem;font-weight:700;font-variant-numeric:tabular-nums}
.tile.pos .val{color:var(--pos)} .tile.neg .val{color:var(--neg)} .tile.bad .val{color:var(--bad)}
.tile .sub{font-size:.78rem;color:var(--muted)}

.capture{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center;background:var(--accent);color:var(--on-accent);border:0;border-radius:14px;padding:14px 16px;text-align:left;box-shadow:var(--shadow)}
.capture .mic{width:48px;height:48px;border-radius:50%;background:rgba(255,255,255,.18);display:grid;place-items:center}
.capture .mic svg{width:24px;height:24px}
.capture strong{display:block;font-size:1.05rem;font-weight:600}
.capture span{font-size:.88rem;opacity:.9}
.quick{display:flex;gap:8px;flex-wrap:wrap}
.chipbtn{background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:9px 14px;font-weight:600;font-size:.88rem;min-height:40px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}
.pend{padding:12px 14px;display:flex;flex-direction:column;gap:8px;border-left:4px solid var(--neg)}
.pend .org{font-size:.78rem;color:var(--muted)}
.pend q{quotes:none;display:block}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.list{display:flex;flex-direction:column}
.list > *{border-bottom:1px solid var(--line)}
.list > *:last-child{border-bottom:0}
.item{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:12px 14px;background:none;border:0;text-align:left;width:100%;align-items:center}
button.item:hover{background:var(--bg)}
.item .t{font-weight:600;min-width:0}
.item .s{font-size:.84rem;color:var(--muted);min-width:0}
.item .v{text-align:right;grid-row:span 2}
.amt{font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.approx{font-size:.78rem;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}

.pill{display:inline-block;font-size:.72rem;font-weight:600;padding:2px 8px;border-radius:99px;white-space:nowrap}
.p-paid{background:var(--pos-soft);color:var(--pos)}
.p-part{background:var(--neg-soft);color:var(--neg)}
.p-open{background:var(--line);color:var(--ink)}
.p-late{background:var(--bad-soft);color:var(--bad)}
.p-dlv,.p-dir{background:var(--accent-soft);color:var(--accent)}
.bal{font-size:.84rem;font-weight:600;white-space:nowrap}
.bal.pos{color:var(--pos)} .bal.neg{color:var(--neg)} .bal.zero{color:var(--muted)}
.search{width:100%;padding:11px 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface);min-height:44px}

.trader-head{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow)}
.trader-head h1{font-size:1.6rem}
.big-bal{font-size:2rem;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.big-bal.pos{color:var(--pos)} .big-bal.neg{color:var(--neg)} .big-bal.zero{color:var(--muted)}
.curlines{display:flex;flex-wrap:wrap;gap:6px}
.curlines span{background:var(--bg);border-radius:8px;padding:4px 10px;font-size:.84rem}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 16px;font-weight:600;min-height:44px;display:inline-flex;gap:6px;align-items:center;justify-content:center;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.ghost{background:none}
.btn.sm{min-height:36px;padding:6px 12px;font-size:.84rem;border-radius:8px}
.btn.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.back{background:none;border:0;color:var(--accent);font-weight:600;padding:6px 0;align-self:flex-start;display:flex;gap:4px;align-items:center}

.deal{padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.deal-top{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:none;border:0;padding:0;text-align:left;width:100%}
.deal-top .g{font-weight:600;flex:1;min-width:12ch}
.deal-math{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:.9rem}
.deal-more{display:flex;flex-direction:column;gap:8px;padding-top:8px;border-top:1px dashed var(--line)}
blockquote.src{margin:0;background:var(--bg);border-radius:10px;padding:10px 12px;font-size:.92rem;border-left:3px solid var(--accent)}
blockquote.src span{display:block;font-size:.74rem;color:var(--muted);margin-bottom:2px}

table{border-collapse:collapse;width:100%;font-size:.9rem}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
th,td{padding:9px 12px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{font-weight:600;color:var(--muted);font-size:.78rem;text-transform:uppercase;letter-spacing:.03em}
tr:last-child td{border-bottom:0}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.profit-pos{color:var(--pos)} .profit-neg{color:var(--bad)}

.src-card{padding:16px;display:flex;flex-direction:column;gap:10px}
.src-card h3{font-size:1rem;font-weight:600;display:flex;gap:8px;align-items:center}
.src-card input[type=url]{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);min-height:44px}
.err{color:var(--bad);font-size:.88rem;margin:0}
.ok{color:var(--pos);font-size:.88rem;margin:0}
.soon{font-size:.7rem;font-weight:600;background:var(--accent-soft);color:var(--accent);padding:2px 8px;border-radius:99px}

nav.bottom{position:fixed;inset:auto 0 0 0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.nav-in{max-width:620px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);align-items:end}
.nav-in button{background:none;border:0;padding:8px 2px 10px;font-size:.72rem;font-weight:600;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;min-height:52px}
.nav-in button[aria-current="page"]{color:var(--accent)}
.nav-in svg{width:22px;height:22px}
.nav-in .fab{transform:translateY(-14px)}
.nav-in .fab span.c{width:56px;height:56px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;box-shadow:var(--shadow)}
.nav-in .fab svg{width:26px;height:26px}
.badge-dot{display:inline-grid;place-items:center;min-width:18px;height:18px;border-radius:9px;background:var(--neg);color:#fff;font-size:.66rem;font-weight:700;padding:0 5px}

#scrim{position:fixed;inset:0;background:rgba(10,14,22,.5);z-index:40}
#sheet{position:fixed;inset:auto 0 0 0;z-index:41;max-height:92%;overflow:auto;background:var(--surface);border-radius:18px 18px 0 0;box-shadow:var(--shadow);padding-block:8px calc(20px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));animation:up .22s ease-out}
@keyframes up{from{transform:translateY(24px);opacity:.6}}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:4px auto 12px}
.sheet-x{position:absolute;top:10px;right:12px;width:40px;height:40px;border-radius:50%;border:0;background:var(--bg);display:grid;place-items:center}
#sheetBody{display:flex;flex-direction:column;gap:14px}
#sheetBody h2{font-size:1.2rem;padding-right:44px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--bg);border-radius:10px;padding:4px;gap:4px}
.seg button{border:0;background:none;border-radius:7px;padding:8px;font-weight:600;color:var(--muted);min-height:38px}
.seg button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.14)}
.seg.two{grid-template-columns:1fr 1fr}
textarea{width:100%;min-height:96px;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);resize:vertical}
.micbig{width:96px;height:96px;border-radius:50%;border:0;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;margin:4px auto 0;box-shadow:var(--shadow)}
.micbig svg{width:40px;height:40px}
.micbig.rec{animation:pulse 1.1s ease-in-out 2}
@keyframes pulse{50%{transform:scale(1.08);box-shadow:0 0 0 14px var(--accent-soft)}}
@media (prefers-reduced-motion:reduce){.micbig.rec,#sheet{animation:none}}
.examples{display:flex;flex-direction:column;gap:6px}
.examples button{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 12px;text-align:left;font-size:.9rem}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fld{display:flex;flex-direction:column;gap:4px;font-size:.82rem;font-weight:500;color:var(--muted);min-width:0}
.fld.wide{grid-column:1/-1}
.fld input,.fld select{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-size:1rem;min-height:44px}
.fld.flag input,.fld.flag select{border-color:var(--neg);background:var(--neg-soft)}
.fld em{font-style:normal;color:var(--neg);font-weight:600;font-size:.78rem}
.totalline{background:var(--accent-soft);border-radius:10px;padding:10px 14px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-weight:600}
#toast{position:fixed;z-index:50;inset:auto 16px calc(92px + env(safe-area-inset-bottom,0px)) 16px;max-width:520px;margin:0 auto;background:var(--ink);color:var(--bg);border-radius:12px;padding:10px 10px 10px 16px;font-weight:600;box-shadow:var(--shadow);display:flex;align-items:center;gap:10px}
#toast span{flex:1}
#toast button{background:none;border:1px solid currentColor;color:inherit;border-radius:8px;padding:6px 12px;font-weight:700;opacity:.9}
.empty{padding:20px;text-align:center;color:var(--muted)}
.maptbl select{padding:6px 8px;border-radius:8px;border:1px solid var(--line);background:var(--bg)}
.files{display:flex;flex-direction:column;gap:6px}
.files button{display:flex;justify-content:space-between;gap:8px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;text-align:left;min-height:44px}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:10px}
.rates{width:100%}
.rates td{font-variant-numeric:tabular-nums}
.ratestrip{display:flex;gap:6px 14px;flex-wrap:wrap;align-items:center;background:none;border:1px dashed var(--line);border-radius:10px;padding:10px 12px;font-size:.84rem;color:var(--muted);text-align:left;width:100%}
.ratestrip b{color:var(--ink);font-weight:600}
ul.howto{margin:0;padding-left:18px;font-size:.88rem;color:var(--muted);display:flex;flex-direction:column;gap:4px}

/* fixtures board (mirrors /fixtures on the live dashboard) */
.lt{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none;margin-inline:-16px;padding-inline:16px}
.lt::-webkit-scrollbar{display:none}
.lt button{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:8px 14px;font-weight:600;font-size:.86rem;color:var(--muted);display:flex;gap:6px;align-items:center;min-height:38px}
.lt button[aria-selected="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.lt button.hot[aria-selected="true"]{background:var(--bad);border-color:var(--bad);color:#fff}
.lt .c{font-size:.72rem;opacity:.75;font-variant-numeric:tabular-nums}
.fx-filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.fx-filters select{padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:.9rem;max-width:100%;min-height:40px}
.fx-filters .seg{display:inline-grid;grid-template-columns:repeat(3,auto);padding:3px}
.fx-filters .seg.two{grid-template-columns:auto auto}
.fx-filters .seg button{padding:5px 12px;font-size:.84rem;min-height:32px}
.fx-filters .seg.off{opacity:.45}
.fx-filters label.chk{display:flex;gap:6px;align-items:center;font-size:.88rem;font-weight:600;min-height:40px}
.fx-group{display:flex;flex-direction:column;gap:8px}
.fx-group h3{font-size:.78rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin:6px 2px 0}
.fx-cards{display:grid;grid-template-columns:1fr;gap:8px}
.fx{padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.fx.dim{opacity:.62}
.fx.primary{border-left:4px solid #1D9E75}
.fx-top{display:flex;justify-content:space-between;gap:8px;font-size:.8rem;color:var(--muted)}
.fx-top b{color:var(--ink);font-weight:700;font-variant-numeric:tabular-nums}
.fx-teams{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px}
.fx-side{display:flex;align-items:center;gap:8px;min-width:0}
.fx-side.away{flex-direction:row-reverse;text-align:right}
.fx-side .nm{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fx-side .nm.on{font-weight:700}
.fx-side .nm.won{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:4px}
.crest{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:.6rem;font-weight:700;color:#fff;letter-spacing:.02em}
.fx-vs{font-size:.74rem;font-weight:700;color:var(--muted);padding:3px 8px;border:1px solid var(--line);border-radius:8px}
.fx-score{font-size:1.15rem;font-weight:700;font-variant-numeric:tabular-nums;padding:2px 10px;background:var(--bg);border-radius:8px}
.fx-tags{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.badge{font-size:.72rem;font-weight:600;padding:3px 8px;border-radius:99px;background:var(--bg);color:var(--muted);border:1px solid var(--line);white-space:nowrap}
.badge.green{background:var(--pos-soft);color:var(--pos);border-color:transparent}
.badge.amber{background:var(--neg-soft);color:var(--neg);border-color:transparent}
.badge.blue{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.badge.hot-elite{background:var(--bad-soft);color:var(--bad);border-color:var(--bad)}
.badge.hot-high{background:var(--neg-soft);color:var(--neg);border-color:var(--neg)}
.badge.hot-drop{background:var(--pos-soft);color:var(--pos);border-color:var(--pos)}
.fx-reason{font-size:.86rem;color:var(--muted);margin:0}
.fx-sh{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:.86rem}
.spark{flex:none}
.spark polyline{fill:none;stroke-width:1.6;stroke-linejoin:round;stroke-linecap:round}
.spark.up polyline{stroke:var(--bad)} .spark.down polyline{stroke:var(--pos)}

const NUMRE='[£€₪]?\\s*(\\d[\\d,]*(?:\\.\\d+)?)';
function parse(text){
  const t=String(text||''),low=t.toLowerCase();
  const r={dir:null,traderId:null,newTrader:null,gameId:null,gameOptions:[],qty:null,unit:null,paid:0,cat:'',cur:null,flags:{}};
  if(/\bsold\b|\bselling\b|\btakes?\b.*\bfrom me\b|מכרתי|מכרנו|לוקח ממני/.test(low))r.dir='sell';
  else if(/\bbought\b|\bbuying\b|\bgot\b|\btook\b|קניתי|קנינו|לקחתי/.test(low))r.dir='buy';
  if(!r.dir)r.flags.dir="Couldn't tell if you bought or sold";
  const hits=S.traders.filter(tr=>tr.aliases.some(a=>has(low,a.toLowerCase())));
  if(hits.length===1)r.traderId=hits[0].id;
  else if(hits.length>1)r.flags.trader='More than one trader mentioned, pick one';
  else{
    const mm=t.match(/\bfrom\s+([A-Z][a-z]+)/)||t.match(/\bsold\s+(?:to\s+)?([A-Z][a-z]+)/)||t.match(/\bto\s+([A-Z][a-z]+)/)||t.match(/\bwith\s+([A-Z][a-z]+)/)||t.match(/(?:קניתי|קנינו|לקחתי)\s+מ([א-ת'"]{2,})/)||t.match(/(?:מכרתי|מכרנו)\s+ל([א-ת'"]{2,})/)||t.match(/עם\s+([א-ת'"]{2,})/);
    const isTeam=w=>S.games.some(g=>g.teams.some(al=>al.some(a=>a.toLowerCase()===w.toLowerCase())));
    if(mm&&!isTeam(mm[1])){r.newTrader=mm[1];r.flags.trader='New trader, check the name';}else r.flags.trader="Couldn't tell who with";
  }
  const q=t.match(/(\d+)\s*(?:tickets?|tix|seats?|כרטיסים|כרטיס|טיקטים)/i);
  if(q)r.qty=+q[1];else{for(const w in NUMW){if(new RegExp('(^|\\s)'+w+'\\s+(?:tickets?|tix|seats?|כרטיס|טיקט)','i').test(t)){r.qty=NUMW[w];break;}}}
  if(!r.qty){const q2=t.match(/(?:^|\s)(\d{1,2})\s+[A-Za-zא-ת]/);if(q2){r.qty=+q2[1];r.flags.qty='Check the quantity';}else r.flags.qty="Couldn't find a quantity";}
  if(/£|\bpounds?\b|\bgbp\b|\bquid\b|פאונד|ליש"ט/i.test(t))r.cur='GBP';
  else if(/€|\beuros?\b|\beur\b|יורו|אירו/i.test(t))r.cur='EUR';
  else if(/₪|\bshekels?\b|\bnis\b|\bils\b|שקל|ש"ח/i.test(t))r.cur='ILS';
  const tot=t.match(new RegExp('(?:in total|total|altogether|סה"כ|סה״כ|ביחד)\\s*(?:of\\s*)?'+NUMRE,'i'));
  const pr=t.match(new RegExp('(?:\\bat|\\bfor|@)\\s*'+NUMRE,'i'))||t.match(new RegExp('(?:^|\\s)(?:ב-?|במחיר\\s*)'+NUMRE))||t.match(/[£€₪]\s*(\d[\d,]*(?:\.\d+)?)/)||t.match(/(\d[\d,]*(?:\.\d+)?)\s*(?:£|€|₪|pounds?|euros?|shekels?|יורו|אירו|שקל|ש"ח)/i);
  if(tot&&r.qty){r.unit=r2(num(tot[1])/r.qty);r.flags.unit='Worked out from the total';}
  else if(pr)r.unit=num(pr[1]);else r.flags.unit="Couldn't find a price";
  if(/paid in full|fully paid|all paid|paid up|שולם במלואו|שילם הכל|שילמתי הכל|שולם הכל/i.test(t))r.paid='full';
  else{const p=t.match(new RegExp('(?:\\bpaid|\\breceived|\\btransferred|\\bgot)\\s*(?:him|her|me|you|us)?\\s*'+NUMRE,'i'))||t.match(new RegExp('(?:שילמתי|שילם|שולם|קיבלתי|העברתי)\\s*(?:לו|לי|לנו)?\\s*'+NUMRE));if(p)r.paid=num(p[1]);}
  const c=t.match(/(?:^|[^A-Za-z])(LUC|LLC|LU|LL|SU|SL)(?![A-Za-z])/i);if(c)r.cat=c[1].toUpperCase();
  const score=g=>g.teams.filter(al=>al.some(a=>has(low,a.toLowerCase()))).length;
  const s2=S.games.filter(g=>score(g)===2),s1=S.games.filter(g=>score(g)===1);
  if(s2.length===1)r.gameId=s2[0].id;
  else if(s2.length>1||s1.length){r.gameOptions=(s2.length?s2:s1).map(g=>g.id);
    if(r.gameOptions.length===1){r.gameId=r.gameOptions[0];r.flags.game='Only one team matched, check the game';}
    else r.flags.game='More than one game fits, pick one';}
  else r.flags.game="Couldn't find the game";
  if(!r.cur){const tr=r.traderId&&trader(r.traderId);r.cur=(tr&&tr.cur)||'GBP';r.flags.cur='Not said. Using '+(tr&&tr.cur?tr.name+"'s usual":'the default')+' ('+SYM[r.cur]+')';}
  return r;
}

function spark(pts){

  return '<svg class="spark '+(pts[pts.length-1]>pts[0]?'up':'down')+'" width="'+W+'" height="'+H+'" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="14-day trend: '+fmt(conv(pts[0],'GBP',CUR))+' to '+fmt(conv(pts[pts.length-1],'GBP',CUR))+'"><polyline points="'+d+'"/></svg>';

  return '<div class="card fx '+(trk||f.hot?'':'dim ')+(f.h===PRIMARY_TEAM?'primary':'')+'">'+
    '<div class="fx-top"><span>'+fullDate(f.ko)+' · <b>'+f.ko.slice(11,16)+'</b></span><span>'+(COMP_ABBR[f.comp]||f.comp)+(f.md?' · MW '+f.md:'')+(f.stage?' · '+esc(f.stage):'')+'</span></div>'+
    '<div class="fx-teams"><span class="fx-side home">'+crest(f.h)+'<span class="nm'+(hT?' on':'')+won('h')+'">'+esc(tn(f.h))+'</span></span>'+
      (hasScore?'<span class="fx-score" title="Full time">'+f.hs+' - '+f.as+'</span>':'<span class="fx-vs">VS</span>')+
      '<span class="fx-side away">'+crest(f.a)+'<span class="nm'+(aT?' on':'')+won('a')+'">'+esc(tn(f.a))+'</span></span></div>'+
    ((trk||hot)?'<div class="fx-tags">'+(trk?'<span class="badge '+(hT?'green':'')+'">'+(hT?'Home':'Away')+'</span>':'')+hot+'</div>':'')+
    (f.hot&&f.hot.reason?'<p class="fx-reason">'+esc(f.hot.reason)+'</p>':'')+
    (f.sh&&!past?'<div class="fx-sh"><span>StubHub from <b class="num">'+fmt(conv(f.sh[f.sh.length-1],'GBP',CUR))+'</b></span>'+spark(f.sh)+(f.ins?'<span class="'+(/^▲/.test(f.ins)?'sh-up':'sh-down')+'">'+esc(f.ins)+'</span>':'')+'</div>':'')+
    pos+pnl+
    '<div class="fx-foot"><span><span class="badge '+t[1]+'">Tickets: '+t[0]+'</span>'+(f.onsale&&f.tix==='not_yet'?' <span class="muted" style="font-size:.8rem">· opens '+dm(f.onsale.slice(0,10))+' '+f.onsale.slice(11,16)+'</span>':'')+(f.edited?' <span class="muted" style="font-size:.76rem">edited</span>':'')+'</span>'+
      '<span class="acts"><a class="btn sm ghost" href="'+esc(calUrl(tn(f.h)+' vs '+tn(f.a),f.ko))+'" target="_blank" rel="noopener">'+IC.cal+'Match</a>'+(f.onsale&&f.tix==='not_yet'?'<a class="btn sm ghost" href="'+esc(calUrl('Tickets: '+tn(f.h)+' vs '+tn(f.a),f.onsale))+'" target="_blank" rel="noopener">'+IC.tix+'Tickets</a>':'')+'<button type="button" class="btn sm ghost" data-fx-edit="'+esc(f.id)+'">'+IC.edit+'Edit</button></span></div>'+
  '</div>';
}

  if(showTable)return tabs+head+lt+vStandings();

    '<select id="fxMonth" aria-label="Month"><option value="">All season</option>'+months.map(k=>'<option value="'+k+'"'+(fx.month===k?' selected':'')+'>'+monthName(k)+'</option>').join('')+'</select>'+
    '<div class="seg'+(fx.team?'':' off')+'" role="group" aria-label="Home or away" title="'+(fx.team?'':'Pick a team first')+'">'+[['all','All'],['home','Home'],['away','Away']].map(o=>'<button type="button" data-fx-ha="'+o[0]+'" aria-selected="'+(fx.ha===o[0])+'"'+(fx.team?'':' disabled')+'>'+o[1]+'</button>').join('')+'</div>'+

    (hasF?'<button type="button" class="linkbtn" id="fxClear">Clear filters</button>':'')+'</div>';

   '</tbody></table></div><div class="row"><button type="button" class="btn primary" id="importRows">Send '+SHEET_ROWS.length+' rows for your OK</button></div>';

function openRates(){
  const rows=[['£1','₪'+RATE.GBP],['€1','₪'+RATE.EUR],['£1','€'+(RATE.GBP/RATE.EUR).toFixed(4)],['€1','£'+(RATE.EUR/RATE.GBP).toFixed(4)],['₪100','£'+(100/RATE.GBP).toFixed(2)+' · €'+(100/RATE.EUR).toFixed(2)]];
  openSheet('<h2>Exchange rates</h2><p class="fine">Bank of Israel representative rate, published '+RATE_AT+'.</p>'+
    '<div class="tbl"><table class="rates"><tbody>'+rows.map(r=>'<tr><td>'+r[0]+'</td><td class="n"><b>'+r[1]+'</b></td></tr>').join('')+'</tbody></table></div>'+
    '<div><div class="fine" style="margin-bottom:6px">Show totals in</div><div class="seg">'+CURS.map(c=>'<button type="button" data-rc="'+c+'" aria-selected="'+(c===CUR)+'">'+SYM[c]+' '+CURNAME[c]+'</button>').join('')+'</div></div>'+
    '<h3 style="font-size:1rem">How it works in the product</h3><ul class="howto">'+
    '<li>The server pulls the representative rate every business day, after the Bank of Israel publishes it.</li>'+
    '<li>Every deal stays in the currency it was closed in. A £ debt is never quietly turned into ₪.</li>'+
    '<li>Totals and P&amp;L are converted to the currency you pick, marked with ≈.</li>'+
    '<li>Each deal keeps the rate of its own day, so last month\'s report does not change when the rate moves.</li>'+

const EX_VOICE=['Bought 4 tickets from Nir for Arsenal Chelsea LU at £215, paid him £430','Sold Moshe 2 tickets for Tottenham Arsenal at £360','Bought 3 tickets from Yossi for Liverpool United at €300, paid in full','מכרתי לדני 2 כרטיסים לטוטנהאם ארסנל ב-1900 שקל'];
const EX_MSG=['done bro 👍 6 tix Liverpool United SU @ 165, sending tmrw','Sol: deal, 4 tickets Arsenal Chelsea LL at €260 each'];
function openAdd(ctxTrader,tab){
  tab=tab||'voice';
  if(tab==='form'){openConfirm('',{label:'Typed in'},null,ctxTrader,true);return;}
  const voice=tab==='voice',t=ctxTrader?trader(ctxTrader):null;
  openSheet('<h2>'+(t?'Deal with '+esc(t.name):'New deal')+'</h2>'+
    '<div class="seg" role="tablist"><button type="button" role="tab" data-tab="voice" aria-selected="'+voice+'">Voice</button><button type="button" role="tab" data-tab="msg" aria-selected="'+(!voice)+'">Message</button><button type="button" role="tab" data-tab="form" aria-selected="false">Form</button></div>'+
    (voice?'<button type="button" class="micbig" id="micBtn" aria-label="Record">'+IC.mic+'</button><p class="fine" id="micHint" style="text-align:center">Tap and talk. Say who, what, how many and how much. English or Hebrew.</p>'
          :'<p class="fine">Copy the closing message from the group or the chat with the trader, and paste it here.</p>')+
    '<label class="fld wide" for="addText">'+(voice?'What you said (transcript)':'The message')+'<textarea id="addText" placeholder="'+(voice?'e.g. Bought 2 tickets from Sol for Tottenham Arsenal at €400':'Paste the message here')+'"></textarea></label>'+
    '<div class="examples"><span class="fine">Try an example:</span>'+(voice?EX_VOICE:EX_MSG).map((x,i)=>'<button type="button" data-ex="'+i+'"'+(/[א-ת]/.test(x)?' dir="rtl" style="text-align:right"':'')+'>'+esc(x)+'</button>').join('')+'</div>'+
    '<p class="err" id="addErr" role="alert" hidden></p><div class="row"><button type="button" class="btn primary" id="parseBtn">Continue</button><button type="button" class="btn ghost" id="addCancel">Cancel</button></div>',b=>{
    $$('[data-tab]',b).forEach(x=>x.addEventListener('click',()=>openAdd(ctxTrader,x.dataset.tab)));
    const list=voice?EX_VOICE:EX_MSG;
    $$('[data-ex]',b).forEach(x=>x.addEventListener('click',()=>{$('#addText').value=list[+x.dataset.ex];$('#addText').dir=/[א-ת]/.test(list[+x.dataset.ex])?'rtl':'ltr';}));
    const mic=$('#micBtn',b);if(mic)mic.addEventListener('click',()=>{mic.classList.remove('rec');void mic.offsetWidth;mic.classList.add('rec');$('#micHint').textContent='In the product, recording works in the app and the bot. The mic is blocked in this preview, so pick an example or type what you would say.';});
    $('#addCancel',b).addEventListener('click',closeSheet);
    $('#parseBtn',b).addEventListener('click',()=>{const v=$('#addText').value.trim();if(v.length<6){const e=$('#addErr');e.textContent='Say or type a deal first.';e.hidden=false;return;}
      openConfirm(v,{label:voice?'Voice note · today':'Pasted message · today'},null,ctxTrader,false);});
  });
}
function fld(id,label,control,flag,wide){return '<label class="fld'+(flag?' flag':'')+(wide?' wide':'')+'" for="'+id+'">'+label+control+(flag?'<em>'+esc(flag)+'</em>':'')+'</label>';}
const curOpts=sel=>CURS.map(c=>'<option value="'+c+'"'+(c===sel?' selected':'')+'>'+SYM[c]+' '+c+'</option>').join('');
function openConfirm(text,source,pendingId,defTrader,manual){
  const dt=defTrader&&trader(defTrader);
  const p=manual?{dir:null,traderId:defTrader,newTrader:null,gameId:null,gameOptions:[],qty:null,unit:null,paid:0,cat:'',cur:(dt&&dt.cur)||'GBP',flags:{}}:parse(text);
  if(!manual&&!p.traderId&&!p.newTrader&&defTrader){p.traderId=defTrader;delete p.flags.trader;if(p.flags.cur&&dt.cur){p.cur=dt.cur;p.flags.cur='Not said. Using '+dt.name+"'s usual ("+SYM[dt.cur]+')';}}
  const paid0=p.paid==='full'?(p.qty&&p.unit?p.qty*p.unit:0):(p.paid||0);
  const F=p.flags;
  const trOpts='<option value="">Pick a trader</option>'+(p.newTrader?'<option value="__new" selected>+ New trader: '+esc(p.newTrader)+'</option>':'')+S.traders.map(t=>'<option value="'+esc(t.id)+'"'+(t.id===p.traderId?' selected':'')+'>'+esc(t.name)+'</option>').join('');
  const gs=[...S.games].sort((a,b)=>a.date.localeCompare(b.date));
  const gOpt=g=>'<option value="'+g.id+'"'+(g.id===p.gameId?' selected':'')+'>'+esc(g.name)+' · '+dm(g.date)+'</option>';
  const gameOpts='<option value="">Pick a game</option>'+(p.gameOptions.length>1?'<optgroup label="Matches the message">'+gs.filter(g=>p.gameOptions.includes(g.id)).map(gOpt).join('')+'</optgroup><optgroup label="All games">'+gs.filter(g=>!p.gameOptions.includes(g.id)).map(gOpt).join('')+'</optgroup>':gs.map(gOpt).join(''));
  openSheet('<h2>'+(manual?'Add a deal':'Confirm this deal?')+'</h2>'+
    (manual?'':'<blockquote class="src"'+(/[א-ת]/.test(source.show||text)?' dir="rtl"':'')+'><span>'+esc(source.label)+'</span>'+esc(source.show||text)+'</blockquote>'+(Object.keys(F).length?'<p class="fine">Anything I was unsure about is in orange. Fix it and confirm.</p>':'<p class="fine">Got everything. Check and confirm.</p>'))+
    '<div class="fields">'+
      fld('f-dir','Type','<select id="f-dir"><option value="">Pick</option><option value="buy"'+(p.dir==='buy'?' selected':'')+'>Bought (from them)</option><option value="sell"'+(p.dir==='sell'?' selected':'')+'>Sold (to them)</option></select>',F.dir)+
      fld('f-trader','Trader','<select id="f-trader">'+trOpts+'</select>',F.trader)+
      fld('f-game','Game','<select id="f-game">'+gameOpts+'</select>',F.game,true)+
      fld('f-qty','Quantity','<input id="f-qty" type="number" inputmode="numeric" min="1" step="1" value="'+(p.qty||'')+'">',F.qty)+
      fld('f-cur','Currency','<select id="f-cur">'+curOpts(p.cur)+'</select>',F.cur)+
      fld('f-unit','Price per ticket','<input id="f-unit" type="number" inputmode="decimal" min="0" step="0.01" value="'+(p.unit||'')+'">',F.unit)+
      fld('f-paid','Paid so far','<input id="f-paid" type="number" inputmode="decimal" min="0" step="0.01" value="'+(paid0||0)+'">',null)+
      fld('f-cat','Category','<input id="f-cat" type="text" maxlength="12" placeholder="LU, SL..." value="'+esc(p.cat)+'">',null,true)+
    '</div><div class="totalline" id="f-total"></div><p class="err" id="f-err" role="alert" hidden></p>'+
    '<div class="row"><button type="button" class="btn primary" id="f-save">Confirm &amp; save</button><button type="button" class="btn ghost" id="f-cancel">Cancel</button></div>'+
    '<p class="fine">Nothing enters the books without your OK.</p>',b=>{
    const upd=()=>{const q=+$('#f-qty').value||0,u=+$('#f-unit').value||0,pd=+$('#f-paid').value||0,c=$('#f-cur').value,tt=q*u;
      $('#f-total').innerHTML='<span>Total '+mo(tt,c)+'</span><span>'+(tt?(pd>=tt?'Paid in full':'Open '+m(Math.max(0,tt-pd),c)):'')+'</span>';};
    const clearFlag=x=>{const l=x.closest('.fld');if(l){l.classList.remove('flag');const e=l.querySelector('em');if(e)e.remove();}};
    $$('input,select',b).forEach(x=>x.addEventListener('input',()=>{clearFlag(x);upd();}));
    /* currency was only guessed: follow the trader's usual currency when the trader changes */
    $('#f-trader').addEventListener('change',()=>{const cf=$('#f-cur').closest('.fld');const t=trader($('#f-trader').value);if(cf.classList.contains('flag')&&t&&t.cur){$('#f-cur').value=t.cur;cf.querySelector('em').textContent='Not said. Using '+t.name+"'s usual ("+SYM[t.cur]+')';upd();}});
    upd();
    $('#f-cancel',b).addEventListener('click',closeSheet);
    $('#f-save',b).addEventListener('click',()=>{
      const dir=$('#f-dir').value,tv=$('#f-trader').value,gid=$('#f-game').value,q=+$('#f-qty').value,u=+$('#f-unit').value,pd=+$('#f-paid').value||0,cur=$('#f-cur').value,cat=$('#f-cat').value.trim().toUpperCase().slice(0,12);
      const miss=[];if(!dir)miss.push('type');if(!tv)miss.push('trader');if(!gid)miss.push('game');if(!(q>0&&Number.isInteger(q)))miss.push('quantity');if(!(u>0))miss.push('price');if(!CURS.includes(cur))miss.push('currency');
      const e=$('#f-err');
      if(miss.length){e.textContent='Missing: '+miss.join(', ')+'.';e.hidden=false;const first={type:'#f-dir',trader:'#f-trader',game:'#f-game',quantity:'#f-qty',price:'#f-unit'}[miss[0]];if(first)$(first).focus();return;}
      if(pd<0||pd>q*u){e.textContent='Paid cannot be more than the deal total ('+fmt(q*u,cur)+').';e.hidden=false;$('#f-paid').focus();return;}
      const s=snap();
      let tid=tv;
      if(tv==='__new'){const name=p.newTrader.trim();const ex=S.traders.find(t=>t.name.toLowerCase()===name.toLowerCase());if(ex)tid=ex.id;else{tid='t'+Date.now();S.traders.push({id:tid,name,aliases:[name.toLowerCase()],note:'New trader',cur});}}
      const d={id:'d'+Date.now(),traderId:tid,dir,gameId:gid,qty:q,unit:u,cur,paid:pd,cat,date:TODAY,delivered:false,src:{label:source.label,text:manual?'':(source.show||text)}};
      S.deals.push(d);
      if(pd>0)S.payments.push({traderId:tid,dir:dir==='buy'?'out':'in',amount:pd,cur,date:TODAY});
      if(pendingId)S.pending=S.pending.filter(x=>x.id!==pendingId);
      closeSheet();go('trader',tid);openDeal=d.id;render();toast("Saved to "+trader(tid).name+"'s book",restore(s));
    });
  });
}
/* Payments: entered in any currency. Applied to open deals oldest-first, same-currency deals first;
   a payment in another currency is converted at the Bank of Israel rate and the conversion is noted. */
function openPay(tid,deal){
  const t=trader(tid);
  const openDs=()=>S.deals.filter(d=>d.traderId===tid&&openAmt(d)>0);
  let dir=deal?(deal.dir==='buy'?'out':'in'):null;
  if(!dir){const o=openDs(),sum=k=>o.filter(d=>d.dir===k).reduce((s,d)=>s+conv(openAmt(d),d.cur,'GBP'),0);dir=sum('buy')>=sum('sell')?'out':'in';}
  const inDir=()=>deal?[deal]:openDs().filter(d=>d.dir===(dir==='out'?'buy':'sell'));
  const targets=c=>inDir().sort((a,b)=>(a.cur===c?0:1)-(b.cur===c?0:1)||a.date.localeCompare(b.date));
  const defCur=()=>deal?deal.cur:((inDir().sort((a,b)=>a.date.localeCompare(b.date))[0]||{}).cur||t.cur||'GBP');
  let cur=defCur();
  const limit=c=>r2(targets(c).reduce((s,d)=>s+conv(openAmt(d),d.cur,c),0));
  const openTxt=()=>{const o={};inDir().forEach(d=>{o[d.cur]=r2((o[d.cur]||0)+openAmt(d));});return Object.keys(o).map(c=>fmt(o[c],c)).join(' + ')||fmt(0,cur);};
  const draw=()=>{
    openSheet('<h2>Record payment</h2>'+(deal?'<p class="fine">For: '+esc(game(deal.gameId).name)+' · open '+m(openAmt(deal),deal.cur)+'</p>':
      '<div class="seg two" role="tablist"><button type="button" role="tab" data-d="out" aria-selected="'+(dir==='out')+'">I paid '+esc(t.name)+'</button><button type="button" role="tab" data-d="in" aria-selected="'+(dir==='in')+'">'+esc(t.name)+' paid me</button></div><p class="fine">Open this way: <b class="num">'+openTxt()+'</b>. Applied to open deals oldest first.</p>')+
      '<div class="fields">'+fld('p-amt','Amount','<input id="p-amt" type="number" inputmode="decimal" min="0" step="0.01" value="'+(limit(cur)||'')+'">',null)+fld('p-cur','Currency','<select id="p-cur">'+curOpts(cur)+'</select>',null)+'</div>'+
      '<p class="fine" id="p-conv"></p><p class="err" id="p-err" role="alert" hidden></p><div class="row"><button type="button" class="btn primary" id="p-save">Record</button><button type="button" class="btn ghost" id="p-cancel">Cancel</button></div>',b=>{
      const convNote=()=>{const c=$('#p-cur').value,a=+$('#p-amt').value||0;const other=[...new Set(targets(c).map(d=>d.cur))].filter(x=>x!==c);
        $('#p-conv').innerHTML='Max '+m(limit(c),c)+'.'+(other.length?' Paying in '+SYM[c]+' against '+other.map(x=>SYM[x]).join('/')+' deals: converted at the Bank of Israel rate'+(a?', '+fmt(a,c)+' = '+other.map(x=>fmt(conv(a,c,x),x)).join(' = '):'')+'.':'');};
      $$('[data-d]',b).forEach(x=>x.addEventListener('click',()=>{dir=x.dataset.d;cur=defCur();draw();}));
      $('#p-cur',b).addEventListener('change',()=>{const c=$('#p-cur').value;$('#p-amt').value=limit(c)||'';convNote();});
      $('#p-amt',b).addEventListener('input',convNote);
      convNote();
      $('#p-cancel',b).addEventListener('click',closeSheet);
      $('#p-save',b).addEventListener('click',()=>{
        const a=+$('#p-amt').value,c=$('#p-cur').value,e=$('#p-err');
        if(!(a>0)){e.textContent='Enter an amount above zero.';e.hidden=false;$('#p-amt').focus();return;}
        if(a>limit(c)+0.009){e.textContent='That is more than what is open ('+fmt(limit(c),c)+'). Check the amount or the direction.';e.hidden=false;$('#p-amt').focus();return;}
        const s=snap();let left=a;const notes=[];
        for(const d of targets(c)){if(left<=0.004)break;const openIn=conv(openAmt(d),d.cur,c);const take=Math.min(left,openIn);
          d.paid=r2(d.paid+conv(take,c,d.cur));if(openAmt(d)<0.01)d.paid=total(d);if(d.cur!==c)notes.push(fmt(take,c)+' → '+fmt(conv(take,c,d.cur),d.cur));left-=take;}
        S.payments.push({traderId:tid,dir,amount:a,cur:c,date:TODAY,note:notes.length?'converted at BoI rate: '+notes.join(', '):''});
        closeSheet();render();toast('Payment of '+fmt(a,c)+' recorded',restore(s));
      });
    });
  };
  draw();
}
function summaryText(tid){
  const t=trader(tid),o=balBy(tid);
  const [y,mo2,d]=TODAY.split('-');
  const ds=S.deals.filter(x=>x.traderId===tid&&openAmt(x)>0).sort((a,c)=>a.date.localeCompare(c.date));
  const line=x=>'• '+dm(x.date)+' '+game(x.gameId).name+', '+x.qty+' × '+fmt(x.unit,x.cur)+' = '+fmt(total(x),x.cur)+(x.paid?', paid '+fmt(x.paid,x.cur):'')+', open '+fmt(openAmt(x),x.cur);
  const buys=ds.filter(x=>x.dir==='buy'),sells=ds.filter(x=>x.dir==='sell');
  let s='Hi '+t.name+', here is what is open between us as of '+d+'/'+mo2+'/'+y+':\n';
  if(buys.length)s+='\nI bought from you:\n'+buys.map(line).join('\n')+'\n';
  if(sells.length)s+='\nI sold to you:\n'+sells.map(line).join('\n')+'\n';
  const ks=Object.keys(o);
  s+='\n'+(ks.length?'Balance: '+ks.map(c=>o[c]>0?'you owe me '+fmt(o[c],c):'I owe you '+fmt(-o[c],c)).join(', and '):'We are all square')+'.\nIf anything does not match, tell me and we will check.';
  return s;
}
function openSummary(tid){
  const s=summaryText(tid);
  openSheet('<h2>Statement for '+esc(trader(tid).name)+'</h2><p class="fine">Ready to send on WhatsApp. You send it yourself, nothing is sent for you. Each debt is listed in its own currency.</p><textarea id="sumText" readonly style="min-height:240px">'+esc(s)+'</textarea>'+
    '<div class="row"><button type="button" class="btn primary" id="sumCopy">'+IC.copy+'Copy</button><a class="btn" href="https://wa.me/?text='+encodeURIComponent(s)+'" target="_blank" rel="noopener">'+IC.send+'Open in WhatsApp</a></div><p class="fine">Later: a link the trader opens to confirm the statement, so you both have an agreed record.</p>',b=>{
    $('#sumCopy',b).addEventListener('click',()=>{const ta=$('#sumText');
      const fallback=()=>{ta.focus();ta.select();toast('Text selected, copy it');};
      try{navigator.clipboard.writeText(ta.value).then(()=>toast('Copied'),fallback);}catch(_){fallback();}});
  });
}
function openNewTrader(){
  openSheet('<h2>New trader</h2><div class="fields">'+fld('nt-name','Name','<input id="nt-name" type="text" maxlength="40" autocomplete="off">',null,true)+fld('nt-note','Note','<input id="nt-note" type="text" maxlength="60" placeholder="Supplier, buyer, area">',null)+fld('nt-cur','Usual currency','<select id="nt-cur">'+curOpts('GBP')+'</select>',null)+'</div><p class="err" id="nt-err" role="alert" hidden></p><div class="row"><button type="button" class="btn primary" id="nt-save">Add</button><button type="button" class="btn ghost" id="nt-cancel">Cancel</button></div>',b=>{
    $('#nt-cancel',b).addEventListener('click',closeSheet);
    $('#nt-save',b).addEventListener('click',()=>{const n=$('#nt-name').value.trim(),e=$('#nt-err');
      if(n.length<2){e.textContent='Enter a name of at least 2 letters.';e.hidden=false;return;}
      if(S.traders.some(t=>t.name.toLowerCase()===n.toLowerCase())){e.textContent='There is already a trader with this name.';e.hidden=false;return;}
      const id='t'+Date.now();S.traders.push({id,name:n,aliases:[n.toLowerCase()],note:$('#nt-note').value.trim(),cur:$('#nt-cur').value});closeSheet();go('trader',id);toast('Added '+n);});
  });
}
