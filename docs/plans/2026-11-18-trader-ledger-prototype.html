<title>ספר הסוחר</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;700&family=Assistant:wght@400;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: phone-first app shell. Sticky header, one scrolling column (max 560px), fixed bottom nav with a raised "+" for capture. */
:root{
  --bg:#f3f6f5; --surface:#ffffff; --ink:#14201d; --muted:#5d6b67; --line:#dce4e1;
  --accent:#0f6b5c; --on-accent:#ffffff; --accent-soft:#e0efea;
  --pos:#1d7a46; --pos-soft:#e3f3e9; --neg:#a8530f; --neg-soft:#fbeedd; --bad:#b3262d; --bad-soft:#fbe5e6;
  --shadow:0 8px 30px rgba(20,40,35,.16);
  --f-display:"Rubik","Assistant",system-ui,sans-serif;
  --f-body:"Assistant",system-ui,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1413; --surface:#161f1d; --ink:#e3ebe8; --muted:#97a6a1; --line:#293532;
  --accent:#4fc2aa; --on-accent:#08201b; --accent-soft:#1a2f2a;
  --pos:#6fd39a; --pos-soft:#17301f; --neg:#eaa458; --neg-soft:#2f2415; --bad:#f07c82; --bad-soft:#341a1c;
  --shadow:0 8px 30px rgba(0,0,0,.5); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1413; --surface:#161f1d; --ink:#e3ebe8; --muted:#97a6a1; --line:#293532;
  --accent:#4fc2aa; --on-accent:#08201b; --accent-soft:#1a2f2a;
  --pos:#6fd39a; --pos-soft:#17301f; --neg:#eaa458; --neg-soft:#2f2415; --bad:#f07c82; --bad-soft:#341a1c;
  --shadow:0 8px 30px rgba(0,0,0,.5); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:400 16px/1.55 var(--f-body);direction:rtl}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num,bdi.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-weight:500}
bdi.num{direction:ltr;unicode-bidi:isolate}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;line-height:1.25}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.top-in{max-width:560px;margin:0 auto;display:flex;align-items:center;gap:10px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{font:700 1.1rem var(--f-display);letter-spacing:-.01em}
.brand b{color:var(--accent)}
.demo-chip{font:500 .72rem var(--f-mono);background:var(--neg-soft);color:var(--neg);padding:2px 8px;border-radius:99px;white-space:nowrap}
.top-in .sp{flex:1}
.linkbtn{background:none;border:0;color:var(--accent);font-weight:600;padding:6px 4px}

main{max-width:560px;margin:0 auto;padding-block:16px calc(110px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:22px}
section{display:flex;flex-direction:column;gap:10px;min-width:0}
.sec-h{display:flex;align-items:baseline;gap:8px}
.sec-h h2{font-size:1.05rem;font-weight:500}
.sec-h .cnt{font:500 .78rem var(--f-mono);color:var(--muted)}
.sec-h .sp{flex:1}
.muted{color:var(--muted)}
.fine{font-size:.85rem;color:var(--muted);margin:0}

.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;text-align:right;display:flex;flex-direction:column;gap:2px}
.tile .lbl{font-size:.85rem;color:var(--muted)}
.tile .val{font:500 1.5rem var(--f-mono);font-variant-numeric:tabular-nums}
.tile.pos .val{color:var(--pos)} .tile.neg .val{color:var(--neg)}
.tile .sub{font-size:.8rem;color:var(--muted)}

.capture{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center;background:var(--accent);color:var(--on-accent);border:0;border-radius:16px;padding:14px 16px;text-align:right}
.capture .mic{width:48px;height:48px;border-radius:50%;background:rgba(255,255,255,.18);display:grid;place-items:center}
.capture strong{display:block;font:500 1.05rem var(--f-display)}
.capture span{font-size:.88rem;opacity:.85}
.quick{display:flex;gap:8px;flex-wrap:wrap}
.chipbtn{background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:7px 14px;font-weight:600;font-size:.92rem}

.card{background:var(--surface);border:1px solid var(--line);border-radius:14px}
.pend{padding:12px 14px;display:flex;flex-direction:column;gap:8px;border-inline-start:4px solid var(--neg)}
.pend .org{font-size:.8rem;color:var(--muted)}
.pend q{font-size:.98rem;quotes:none;display:block}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

.list{display:flex;flex-direction:column}
.list > *{border-bottom:1px solid var(--line)}
.list > *:last-child{border-bottom:0}
.item{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:12px 14px;background:none;border:0;text-align:right;width:100%;align-items:center}
.item .t{font-weight:600;min-width:0}
.item .s{font-size:.85rem;color:var(--muted);min-width:0}
.item .v{text-align:left;grid-row:span 2}
.amt{font:500 1rem var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}

.pill{display:inline-block;font:600 .74rem var(--f-body);padding:2px 9px;border-radius:99px;white-space:nowrap}
.p-paid{background:var(--pos-soft);color:var(--pos)}
.p-part{background:var(--neg-soft);color:var(--neg)}
.p-open{background:var(--bad-soft);color:var(--bad)}
.p-dlv{background:var(--accent-soft);color:var(--accent)}
.p-dir{background:var(--accent-soft);color:var(--accent)}

.bal{font-size:.85rem;font-weight:600;white-space:nowrap}
.bal.pos{color:var(--pos)} .bal.neg{color:var(--neg)} .bal.zero{color:var(--muted)}

.search{width:100%;padding:11px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface)}

.trader-head{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px}
.trader-head h1{font-size:1.6rem}
.big-bal{font:500 1.9rem var(--f-mono);font-variant-numeric:tabular-nums}
.big-bal.pos{color:var(--pos)} .big-bal.neg{color:var(--neg)} .big-bal.zero{color:var(--muted)}
.split{display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:.88rem}
.split div{background:var(--bg);border-radius:10px;padding:8px 10px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 16px;font-weight:600}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.ghost{background:none}
.btn:disabled{opacity:.45;cursor:not-allowed}
.back{background:none;border:0;color:var(--accent);font-weight:600;padding:0;align-self:flex-start}

.deal{padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.deal-top{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:none;border:0;padding:0;text-align:right;width:100%}
.deal-top .g{font-weight:600;flex:1;min-width:10ch}
.deal-math{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:.92rem}
.deal-more{display:flex;flex-direction:column;gap:8px;padding-top:6px;border-top:1px dashed var(--line)}
blockquote.src{margin:0;background:var(--bg);border-radius:10px;padding:10px 12px;font-size:.92rem;border-inline-start:3px solid var(--accent)}
blockquote.src span{display:block;font-size:.76rem;color:var(--muted);margin-bottom:2px}

table{border-collapse:collapse;width:100%;font-size:.9rem}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th{font-weight:600;color:var(--muted);font-size:.8rem}
tr:last-child td{border-bottom:0}
td.n{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.profit-pos{color:var(--pos)} .profit-neg{color:var(--bad)}

.src-card{padding:14px;display:flex;flex-direction:column;gap:10px}
.src-card h3{font-size:1rem;font-weight:500;display:flex;gap:8px;align-items:center}
.src-card input[type=url]{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);direction:ltr;text-align:left}
.err{color:var(--bad);font-size:.88rem;margin:0}
.ok{color:var(--pos);font-size:.88rem;margin:0}
.soon{font:600 .72rem var(--f-body);background:var(--accent-soft);color:var(--accent);padding:2px 8px;border-radius:99px}

nav.bottom{position:fixed;inset:auto 0 0 0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.nav-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);align-items:end}
.nav-in button{background:none;border:0;padding:8px 2px 10px;font-size:.76rem;font-weight:600;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px}
.nav-in button[aria-current="page"]{color:var(--accent)}
.nav-in svg{width:22px;height:22px}
.nav-in .fab{transform:translateY(-14px)}
.nav-in .fab span.c{width:56px;height:56px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;box-shadow:var(--shadow)}
.nav-in .fab svg{width:26px;height:26px}

#scrim{position:fixed;inset:0;background:rgba(5,15,12,.45);z-index:40}
#sheet{position:fixed;inset:auto 0 0 0;z-index:41;max-height:92%;overflow:auto;background:var(--surface);border-radius:20px 20px 0 0;box-shadow:var(--shadow);padding-block:8px calc(20px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
@media (min-width:600px){#sheet{max-width:560px;margin:0 auto}}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:4px auto 12px}
#sheetBody{display:flex;flex-direction:column;gap:14px}
#sheetBody h2{font-size:1.25rem}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--bg);border-radius:12px;padding:4px;gap:4px}
.seg button{border:0;background:none;border-radius:9px;padding:8px;font-weight:600;color:var(--muted)}
.seg button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.seg.two{grid-template-columns:1fr 1fr}
textarea{width:100%;min-height:96px;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);resize:vertical}
.micbig{width:96px;height:96px;border-radius:50%;border:0;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;margin:4px auto 0;box-shadow:var(--shadow)}
.micbig svg{width:40px;height:40px}
.micbig.rec{animation:pulse 1.1s ease-in-out 2}
@keyframes pulse{50%{transform:scale(1.08);box-shadow:0 0 0 14px var(--accent-soft)}}
@media (prefers-reduced-motion:reduce){.micbig.rec{animation:none}}
.examples{display:flex;flex-direction:column;gap:6px}
.examples button{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 12px;text-align:right;font-size:.9rem}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fld{display:flex;flex-direction:column;gap:4px;font-size:.84rem;color:var(--muted);min-width:0}
.fld.wide{grid-column:1/-1}
.fld input,.fld select{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-size:1rem}
.fld.flag input,.fld.flag select{border-color:var(--neg);background:var(--neg-soft)}
.fld em{font-style:normal;color:var(--neg);font-weight:600;font-size:.8rem}
.totalline{background:var(--accent-soft);border-radius:12px;padding:10px 14px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-weight:600}
#toast{position:fixed;z-index:50;inset:auto 16px calc(92px + env(safe-area-inset-bottom,0px)) 16px;max-width:520px;margin:0 auto;background:var(--ink);color:var(--bg);border-radius:12px;padding:12px 16px;font-weight:600;box-shadow:var(--shadow)}
.empty{padding:20px;text-align:center;color:var(--muted)}
.maptbl select{padding:6px 8px;border-radius:8px;border:1px solid var(--line);background:var(--bg)}
.files{display:flex;flex-direction:column;gap:6px}
.files button{display:flex;justify-content:space-between;gap:8px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;text-align:right}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:10px}

/* ---------- fixtures board (mirrors /fixtures on the live dashboard) ---------- */
.fx-head{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.fx-head h1{font-size:1.3rem;flex:1;min-width:12ch}
.fx-head .sub{flex-basis:100%;margin:0;color:var(--muted);font-size:.88rem}
.btn.sm{padding:6px 10px;font-size:.84rem;border-radius:10px}
.btn.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.lt{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none;margin-inline:-16px;padding-inline:16px}
.lt::-webkit-scrollbar{display:none}
.lt button{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:7px 12px;font-weight:600;font-size:.86rem;color:var(--muted);display:flex;gap:6px;align-items:center}
.lt button[aria-selected="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.lt button.hot[aria-selected="true"]{background:var(--bad);border-color:var(--bad);color:#fff}
.lt .c{font:600 .72rem var(--f-mono);opacity:.75}
.fx-filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.fx-filters select{padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:.9rem;max-width:100%}
.fx-filters .seg{display:inline-grid;grid-template-columns:repeat(3,auto);padding:3px}
.fx-filters .seg.two{grid-template-columns:auto auto}
.fx-filters .seg button{padding:5px 10px;font-size:.84rem}
.fx-filters .seg.off{opacity:.45}
.fx-filters label.chk{display:flex;gap:6px;align-items:center;font-size:.88rem;font-weight:600}
.fx-group{display:flex;flex-direction:column;gap:8px}
.fx-group h3{font:600 .82rem var(--f-body);color:var(--muted);letter-spacing:.02em;margin:6px 2px 0}
.fx{padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.fx.dim{opacity:.6}
.fx.primary{border-inline-start:4px solid var(--pos)}
.fx-top{display:flex;justify-content:space-between;gap:8px;font-size:.8rem;color:var(--muted)}
.fx-top b{font-family:var(--f-mono);color:var(--ink);font-weight:600}
.fx-teams{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px}
.fx-side{display:flex;align-items:center;gap:8px;min-width:0}
.fx-side.away{flex-direction:row-reverse;text-align:left}
.fx-side .nm{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fx-side .nm.on{font-weight:700;color:var(--ink)}
.fx-side .nm.won{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:4px}
.crest{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font:700 .64rem var(--f-mono);color:#fff;letter-spacing:.02em}
.fx-vs{font:600 .76rem var(--f-mono);color:var(--muted);padding:3px 8px;border:1px solid var(--line);border-radius:8px}
.fx-score{font:700 1.15rem var(--f-mono);direction:ltr;unicode-bidi:isolate;padding:2px 10px;background:var(--bg);border-radius:8px}
.fx-tags{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.badge{font:600 .74rem var(--f-body);padding:3px 8px;border-radius:99px;background:var(--bg);color:var(--muted);border:1px solid var(--line)}
.badge.green{background:var(--pos-soft);color:var(--pos);border-color:transparent}
.badge.amber{background:var(--neg-soft);color:var(--neg);border-color:transparent}
.badge.blue{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.badge.hot-elite{background:var(--bad-soft);color:var(--bad);border-color:var(--bad)}
.badge.hot-high{background:var(--neg-soft);color:var(--neg);border-color:var(--neg)}
.badge.hot-drop{background:var(--pos-soft);color:var(--pos);border-color:var(--pos)}
.fx-reason{font-size:.86rem;color:var(--muted);margin:0}
.fx-sh{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:.86rem}
.fx-sh .p{font-weight:700;font-family:var(--f-mono)}
.spark{flex:none}
.spark polyline{fill:none;stroke-width:1.6;stroke-linejoin:round;stroke-linecap:round}
.spark.up polyline{stroke:var(--bad)} .spark.down polyline{stroke:var(--pos)}
.sh-up{color:var(--bad);font-weight:600} .sh-down{color:var(--pos);font-weight:600}
.fx-pos{background:var(--accent-soft);border-radius:10px;padding:8px 10px;font-size:.86rem;display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center;border:0;text-align:right;width:100%;color:var(--ink)}
.fx-pos b{color:var(--accent)}
.fx-pnl{border-radius:10px;padding:8px 10px;display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline;border:1px solid}
.fx-pnl.pos{background:var(--pos-soft);border-color:var(--pos)} .fx-pnl.neg{background:var(--bad-soft);border-color:var(--bad)}
.fx-pnl .mn{font-weight:700} .fx-pnl.pos .mn{color:var(--pos)} .fx-pnl.neg .mn{color:var(--bad)}
.fx-pnl .sb{font-size:.8rem;color:var(--muted)}
.fx-foot{display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:space-between;border-top:1px dashed var(--line);padding-top:8px}
.fx-foot .acts{display:flex;gap:6px;flex-wrap:wrap}
.fx-foot a.btn{text-decoration:none;color:var(--ink)}
.fx-total{border-radius:12px;padding:10px 14px;font-weight:700}
.fx-total.pos{background:var(--pos-soft);color:var(--pos)} .fx-total.neg{background:var(--bad-soft);color:var(--bad)}
.fx-total span{font-weight:400;color:var(--muted);font-size:.84rem}
.kd{padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.kd h4{font-size:.92rem;font-weight:600}
.kd ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.kd li{display:flex;flex-direction:column;font-size:.86rem;background:var(--bg);border-radius:10px;padding:8px 10px}
.kd li .w{font-weight:700} .kd li .n{color:var(--muted);font-size:.8rem}
.st td.pos-c,.st th.pos-c{width:2.5em;text-align:center}
.st tr.trk td{background:var(--accent-soft);font-weight:600}
.st .tm{display:flex;gap:8px;align-items:center}
.st .tm .crest{width:22px;height:22px;font-size:.5rem}
.form{display:flex;gap:2px}
.form i{font:700 .62rem var(--f-mono);font-style:normal;width:16px;height:16px;border-radius:4px;display:grid;place-items:center;color:#fff}
.form .w{background:#1d7a46} .form .d{background:#8a948f} .form .l{background:#b3262d}
@media (max-width:420px){.st .hide-sm{display:none}}
</style>

<header class="top"><div class="top-in">
  <span class="brand">Game<b>Yield</b></span>
  <span class="demo-chip">סקיצה · נתוני דוגמה</span>
  <span class="sp"></span>
  <button class="linkbtn" id="resetBtn" type="button">איפוס</button>
</div></header>

<main id="view" aria-live="polite"></main>

<nav class="bottom" aria-label="ניווט"><div class="nav-in">

/* ---------- demo parser (the real product sends this to the AI, same output shape) ---------- */
const NUMW={'אחד':1,'אחת':1,'שניים':2,'שתיים':2,'שני':2,'שתי':2,'שלושה':3,'שלוש':3,'ארבעה':4,'ארבע':4,'חמישה':5,'חמש':5,'שישה':6,'שש':6,'שבעה':7,'שבע':7,'שמונה':8,'עשרה':10,'עשר':10};
function parse(text){
  const t=String(text||''); const low=t.toLowerCase();
  const r={dir:null,traderId:null,newTrader:null,gameId:null,gameOptions:[],qty:null,unit:null,paid:0,cat:'',flags:{}};
  if(/מכרתי|מכרנו|לוקח ממני|sold/.test(low))r.dir='sell';else if(/קניתי|קנינו|לקחתי|bought/.test(low))r.dir='buy';
  if(!r.dir)r.flags.dir='לא ברור אם קנית או מכרת';
  const hits=S.traders.filter(tr=>tr.aliases.some(a=>low.includes(a.toLowerCase())));
  if(hits.length===1)r.traderId=hits[0].id;
  else if(hits.length>1)r.flags.trader='מופיעים כמה סוחרים, לבחור';
  else{
    const mm=t.match(/(?:קניתי|קנינו|לקחתי)\s+מ([א-ת'"]{2,})/)||t.match(/(?:מכרתי|מכרנו)\s+ל([א-ת'"]{2,})/)||t.match(/עם\s+([א-ת'"]{2,})/);
    if(mm){r.newTrader=mm[1];r.flags.trader='סוחר חדש, לוודא את השם';}else r.flags.trader='לא זיהיתי עם מי';
  }
  const q=t.match(/(\d+)\s*(?:כרטיסים|כרטיס|טיקטים|tickets?)/i);
  if(q)r.qty=+q[1];else{for(const w in NUMW){if(new RegExp('(^|\\s)'+w+'\\s+(?:כרטיס|טיקט)').test(t)){r.qty=NUMW[w];break;}}}
  if(!r.qty){const q2=t.match(/(?:^|\s)(\d{1,2})\s+[א-תa-z]/i);if(q2){r.qty=+q2[1];r.flags.qty='לוודא כמות';}else r.flags.qty='לא זיהיתי כמות';}
  const tot=t.match(/(?:סה"כ|סה״כ|ביחד|בסך הכל|total)\s*€?\s*(\d[\d,.]*)/i);
  const pr=t.match(/(?:ב-?|במחיר\s*|@\s*)€?\s*(\d[\d,.]*)/)||t.match(/€\s*(\d[\d,.]*)/)||t.match(/(\d[\d,.]*)\s*(?:€|יורו|אירו|euro)/i);
  if(tot&&r.qty){r.unit=Math.round(num(tot[1])/r.qty*100)/100;r.flags.unit='חושב מהסכום הכולל';}
  else if(pr)r.unit=num(pr[1]);else r.flags.unit='לא זיהיתי מחיר';
  if(/שולם במלואו|שילם הכל|שילמתי הכל|שולם הכל|שולם\s*$/.test(t))r.paid='full';
  else{const p=t.match(/(?:שילמתי|שילם|שולם|קיבלתי|העברתי)\s*(?:לו|לי|לנו)?\s*€?\s*(\d[\d,.]*)/);if(p)r.paid=num(p[1]);}
  const c=t.match(/(?:^|[^A-Za-z])(LUC|LLC|LU|LL|SU|SL)(?![A-Za-z])/i);if(c)r.cat=c[1].toUpperCase();
  const score=g=>g.teams.filter(al=>al.some(a=>low.includes(a.toLowerCase()))).length;
  const s2=S.games.filter(g=>score(g)===2),s1=S.games.filter(g=>score(g)===1);
  if(s2.length===1)r.gameId=s2[0].id;
  else if(s2.length>1||s1.length){r.gameOptions=(s2.length?s2:s1).map(g=>g.id);
    if(r.gameOptions.length===1){r.gameId=r.gameOptions[0];r.flags.game='זוהתה רק קבוצה אחת, לוודא';}
    else r.flags.game='כמה משחקים מתאימים, לבחור';}
  else r.flags.game='לא זיהיתי משחק';
  return r;
}

function spark(pts){

  return '<svg dir="ltr" class="spark '+(pts[pts.length-1]>pts[0]?'up':'down')+'" width="'+W+'" height="'+H+'" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="מגמת 14 יום: '+Math.round(pts[0])+' ל-'+Math.round(pts[pts.length-1])+'"><polyline points="'+d+'"/></svg>';

    '<p class="err" id="addErr" hidden></p><div class="row"><button type="button" class="btn primary" id="parseBtn">המשך לאישור</button><button type="button" class="btn ghost" id="addCancel">ביטול</button></div>',b=>{
    $$('[data-tab]',b).forEach(x=>x.addEventListener('click',()=>openAdd(ctxTrader,x.dataset.tab)));
    const list=voice?EX_VOICE:EX_MSG;
    $$('[data-ex]',b).forEach(x=>x.addEventListener('click',()=>{$('#addText').value=list[+x.dataset.ex];}));
    const mic=$('#micBtn',b);if(mic)mic.addEventListener('click',()=>{mic.classList.remove('rec');void mic.offsetWidth;mic.classList.add('rec');$('#micHint').textContent='במוצר ההקלטה עובדת בבוט ובאפליקציה. בתצוגה הזו המיקרופון חסום, אז בחר דוגמה או הקלד את מה שהיית אומר.';});
    $('#addCancel',b).addEventListener('click',closeSheet);
    $('#parseBtn',b).addEventListener('click',()=>{const v=$('#addText').value.trim();if(v.length<6){const e=$('#addErr');e.textContent='כתוב או בחר עסקה קודם.';e.hidden=false;return;}
      openConfirm(v,{label:voice?'הודעה קולית · היום':'הודעה שהודבקה · היום'},null,ctxTrader,false);});
  });
}
function fld(id,label,control,flag,wide){return '<label class="fld'+(flag?' flag':'')+(wide?' wide':'')+'" for="'+id+'">'+label+control+(flag?'<em>'+esc(flag)+'</em>':'')+'</label>';}
function openConfirm(text,source,pendingId,defTrader,manual){
  const p=manual?{dir:null,traderId:defTrader,newTrader:null,gameId:null,gameOptions:[],qty:null,unit:null,paid:0,cat:'',flags:{}}:parse(text);
  if(!manual&&!p.traderId&&!p.newTrader&&defTrader){p.traderId=defTrader;delete p.flags.trader;}
  const paid0=p.paid==='full'?(p.qty&&p.unit?p.qty*p.unit:0):(p.paid||0);
  const F=p.flags;
  const trOpts='<option value="">בחר סוחר</option>'+(p.newTrader?'<option value="__new" selected>+ סוחר חדש: '+esc(p.newTrader)+'</option>':'')+S.traders.map(t=>'<option value="'+esc(t.id)+'"'+(t.id===p.traderId?' selected':'')+'>'+esc(t.name)+'</option>').join('');
  const gs=[...S.games].sort((a,b)=>a.date.localeCompare(b.date));
  const gOpt=g=>'<option value="'+g.id+'"'+(g.id===p.gameId?' selected':'')+'>'+esc(g.name)+' · '+dm(g.date)+'</option>';
  const gameOpts='<option value="">בחר משחק</option>'+(p.gameOptions.length>1?'<optgroup label="מתאימים להודעה">'+gs.filter(g=>p.gameOptions.includes(g.id)).map(gOpt).join('')+'</optgroup><optgroup label="כל המשחקים">'+gs.filter(g=>!p.gameOptions.includes(g.id)).map(gOpt).join('')+'</optgroup>':gs.map(gOpt).join(''));
  openSheet('<h2>'+(manual?'הזנה ידנית':'לאשר את העסקה?')+'</h2>'+
    (manual?'':'<blockquote class="src"><span>'+esc(source.label)+'</span>'+esc(source.show||text)+'</blockquote>'+(Object.keys(F).length?'<p class="fine">סימנתי בכתום את מה שלא הייתי בטוח בו. תקן ואשר.</p>':'<p class="fine">זיהיתי הכול. בדוק ואשר.</p>'))+
    '<div class="fields">'+
      fld('f-dir','סוג','<select id="f-dir"><option value="">בחר</option><option value="buy"'+(p.dir==='buy'?' selected':'')+'>קנייה (קנית ממנו)</option><option value="sell"'+(p.dir==='sell'?' selected':'')+'>מכירה (מכרת לו)</option></select>',F.dir)+
      fld('f-trader','סוחר','<select id="f-trader">'+trOpts+'</select>',F.trader)+
      fld('f-game','משחק','<select id="f-game">'+gameOpts+'</select>',F.game,true)+
      fld('f-qty','כמות','<input id="f-qty" type="number" inputmode="numeric" min="1" step="1" value="'+(p.qty||'')+'">',F.qty)+
      fld('f-unit','מחיר ליחידה (€)','<input id="f-unit" type="number" inputmode="decimal" min="0" step="0.01" value="'+(p.unit||'')+'">',F.unit)+
      fld('f-paid','שולם עד עכשיו (€)','<input id="f-paid" type="number" inputmode="decimal" min="0" step="0.01" value="'+(paid0||0)+'">',null)+
      fld('f-cat','קטגוריה','<input id="f-cat" type="text" maxlength="12" placeholder="LU, SL..." value="'+esc(p.cat)+'">',null)+
    '</div><div class="totalline" id="f-total"></div><p class="err" id="f-err" hidden></p>'+
    '<div class="row"><button type="button" class="btn primary" id="f-save">אשר ושמור</button><button type="button" class="btn ghost" id="f-cancel">ביטול</button></div>'+
    '<p class="fine">שום דבר לא נכנס לספרים בלי האישור שלך.</p>',b=>{
    const upd=()=>{const q=+$('#f-qty').value||0,u=+$('#f-unit').value||0,pd=+$('#f-paid').value||0,tt=q*u;$('#f-total').innerHTML='<span>סה"כ '+m(tt)+'</span><span>'+(tt?(pd>=tt?'שולם במלואו':'פתוח '+m(Math.max(0,tt-pd))):'')+'</span>';};
    $$('input,select',b).forEach(x=>{x.addEventListener('input',()=>{const l=x.closest('.fld');if(l){l.classList.remove('flag');const e=l.querySelector('em');if(e)e.remove();}upd();});});
    upd();
    $('#f-cancel',b).addEventListener('click',closeSheet);
    $('#f-save',b).addEventListener('click',()=>{
      const dir=$('#f-dir').value,tv=$('#f-trader').value,gid=$('#f-game').value,q=+$('#f-qty').value,u=+$('#f-unit').value,pd=+$('#f-paid').value||0,cat=$('#f-cat').value.trim().toUpperCase().slice(0,12);
      const miss=[];if(!dir)miss.push('סוג');if(!tv)miss.push('סוחר');if(!gid)miss.push('משחק');if(!(q>0&&Number.isInteger(q)))miss.push('כמות');if(!(u>0))miss.push('מחיר');
      const e=$('#f-err');
      if(miss.length){e.textContent='חסר: '+miss.join(', ');e.hidden=false;return;}
      if(pd<0||pd>q*u){e.textContent='הסכום ששולם לא יכול להיות גדול מסה"כ העסקה ('+fmt(q*u)+').';e.hidden=false;return;}
      let tid=tv;
      if(tv==='__new'){const name=p.newTrader.trim();const ex=S.traders.find(t=>t.name===name);if(ex)tid=ex.id;else{tid='t'+Date.now();S.traders.push({id:tid,name,aliases:[name],note:'סוחר חדש'});}}
      const d={id:'d'+Date.now(),traderId:tid,dir,gameId:gid,qty:q,unit:u,paid:pd,cat,date:TODAY,delivered:false,src:{label:source.label,text:manual?'':(source.show||text)}};
      S.deals.push(d);
      if(pd>0)S.payments.push({traderId:tid,dir:dir==='buy'?'out':'in',amount:pd,date:TODAY});
      if(pendingId)S.pending=S.pending.filter(x=>x.id!==pendingId);
      closeSheet();go('trader',tid);openDeal=d.id;render();toast('נשמר בספר של '+trader(tid).name);
    });
  });
}
function openPay(tid,deal){
  const t=trader(tid),ds=S.deals.filter(d=>d.traderId===tid&&openAmt(d)>0);
  const outOpen=ds.filter(d=>d.dir==='buy').reduce((s,d)=>s+openAmt(d),0),inOpen=ds.filter(d=>d.dir==='sell').reduce((s,d)=>s+openAmt(d),0);
  let dir=deal?(deal.dir==='buy'?'out':'in'):(outOpen>=inOpen?'out':'in');
  const limit=()=>deal?openAmt(deal):(dir==='out'?outOpen:inOpen);
  const draw=()=>{
    openSheet('<h2>רישום תשלום</h2>'+(deal?'<p class="fine">לעסקה: '+esc(game(deal.gameId).name)+' · פתוח '+m(openAmt(deal))+'</p>':
      '<div class="seg two" role="tablist"><button type="button" role="tab" data-d="out" aria-selected="'+(dir==='out')+'">שילמתי ל'+esc(t.name)+'</button><button type="button" role="tab" data-d="in" aria-selected="'+(dir==='in')+'">'+esc(t.name)+' שילם לי</button></div><p class="fine">פתוח בכיוון הזה: '+m(limit())+'. התשלום נפרס על העסקאות הפתוחות לפי הוותק, מהישנה לחדשה.</p>')+
      fld('p-amt','סכום (€)','<input id="p-amt" type="number" inputmode="decimal" min="0" step="0.01" value="'+(limit()||'')+'">',null,true)+
      '<p class="err" id="p-err" hidden></p><div class="row"><button type="button" class="btn primary" id="p-save">רשום</button><button type="button" class="btn ghost" id="p-cancel">ביטול</button></div>',b=>{
      $$('[data-d]',b).forEach(x=>x.addEventListener('click',()=>{dir=x.dataset.d;draw();}));
      $('#p-cancel',b).addEventListener('click',closeSheet);
      $('#p-save',b).addEventListener('click',()=>{
        const a=+$('#p-amt').value,e=$('#p-err');
        if(!(a>0)){e.textContent='הכנס סכום גדול מאפס.';e.hidden=false;return;}
        if(a>limit()+0.001){e.textContent='הסכום גדול מהחוב הפתוח ('+fmt(limit())+'). בדוק את הסכום או את הכיוון.';e.hidden=false;return;}
        let left=a;
        const targets=deal?[deal]:ds.filter(d=>d.dir===(dir==='out'?'buy':'sell')).sort((x,y)=>x.date.localeCompare(y.date));
        for(const d of targets){if(left<=0)break;const take=Math.min(left,openAmt(d));d.paid=Math.round((d.paid+take)*100)/100;left-=take;}
        S.payments.push({traderId:tid,dir,amount:a,date:TODAY});
        closeSheet();render();toast('נרשם תשלום של '+fmt(a));
      });
    });
  };
  draw();
}
function summaryText(tid){
  const t=trader(tid),b=bal(tid);
  const [y,mo,d]=TODAY.split('-');
  const ds=S.deals.filter(x=>x.traderId===tid&&openAmt(x)>0).sort((a,c)=>a.date.localeCompare(c.date));
  const line=x=>'• '+dm(x.date)+' '+game(x.gameId).name+', '+x.qty+' × '+fmt(x.unit)+' = '+fmt(total(x))+(x.paid?', שולם '+fmt(x.paid):'')+', פתוח '+fmt(openAmt(x));
  const buys=ds.filter(x=>x.dir==='buy'),sells=ds.filter(x=>x.dir==='sell');
  let s='היי '+t.name+', סיכום פתוח בינינו נכון ל-'+d+'.'+mo+'.'+y+':\n';
  if(buys.length)s+='\nקניתי ממך:\n'+buys.map(line).join('\n')+'\n';
  if(sells.length)s+='\nמכרתי לך:\n'+sells.map(line).join('\n')+'\n';
  s+='\n'+(b>0?'סה"כ אתה חייב לי '+fmt(b):b<0?'סה"כ אני חייב לך '+fmt(-b):'אנחנו מאוזנים')+'.\nאם משהו לא מסתדר לך, תגיד ונבדוק.';
  return s;
}
function openSummary(tid){
  const s=summaryText(tid);
  openSheet('<h2>סיכום לשליחה</h2><p class="fine">טקסט מוכן להדבקה בווטסאפ. אתה שולח בעצמך, המערכת לא שולחת בשמך.</p><textarea id="sumText" readonly style="min-height:240px">'+esc(s)+'</textarea><div class="row"><button type="button" class="btn primary" id="sumCopy">העתק</button><button type="button" class="btn ghost" id="sumClose">סגור</button></div><p class="fine">בהמשך: קישור שהסוחר פותח ומאשר את הסיכום, כך שלשניכם יש תיעוד מוסכם.</p>',b=>{
    $('#sumClose',b).addEventListener('click',closeSheet);
    $('#sumCopy',b).addEventListener('click',()=>{const ta=$('#sumText');
      const fallback=()=>{ta.focus();ta.select();toast('הטקסט מסומן, העתק אותו');};
      try{navigator.clipboard.writeText(ta.value).then(()=>toast('הועתק'),fallback);}catch(_){fallback();}});
  });
}
function openNewTrader(){
  openSheet('<h2>סוחר חדש</h2>'+fld('nt-name','שם','<input id="nt-name" type="text" maxlength="40" autocomplete="off">',null,true)+fld('nt-note','הערה','<input id="nt-note" type="text" maxlength="60" placeholder="ספק, קונה, תחום">',null,true)+'<p class="err" id="nt-err" hidden></p><div class="row"><button type="button" class="btn primary" id="nt-save">הוסף</button><button type="button" class="btn ghost" id="nt-cancel">ביטול</button></div>',b=>{
    $('#nt-cancel',b).addEventListener('click',closeSheet);
    $('#nt-save',b).addEventListener('click',()=>{const n=$('#nt-name').value.trim(),e=$('#nt-err');
      if(n.length<2){e.textContent='הכנס שם של שתי אותיות לפחות.';e.hidden=false;return;}
      if(S.traders.some(t=>t.name===n)){e.textContent='כבר יש סוחר בשם הזה.';e.hidden=false;return;}
      const id='t'+Date.now();S.traders.push({id,name:n,aliases:[n],note:$('#nt-note').value.trim()});closeSheet();go('trader',id);toast('נוסף '+n);});
  });
}

render();
})();
</script>
